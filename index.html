<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- GitHub Pages ไม่ส่ง CSP header มาให้ จึงประกาศผ่าน meta แทน
     หน้านี้เป็น static ล้วน ไม่เรียก network เลย จึงล็อกได้แน่นเกือบทั้งหมด:
     connect-src 'none' = ต่อให้มีสคริปต์แปลกปลอมหลุดเข้ามาก็ส่งข้อมูลออกไม่ได้
     script-src ไม่มี 'self'/host ใดๆ = โหลดสคริปต์จากภายนอกไม่ได้เลย
     ('unsafe-inline' จำเป็นเพราะทั้งแอปเป็น inline script/style ก้อนเดียว)
     หมายเหตุ: frame-ancestors ใช้ผ่าน meta ไม่ได้ ต้องตั้งที่ HTTP header ซึ่ง Pages ไม่เปิดให้ตั้ง -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="description" content="คอร์สเตรียมสอบ CKNE (Certified Kubernetes Network Engineer) แบบ hands-on ครบทั้ง 5 domain พร้อมแล็บรันบน cluster จริง และกล่องปูพื้นฐานสำหรับผู้เริ่มต้นในทุกหัวข้อ">
<meta name="color-scheme" content="light dark">
<meta property="og:title" content="CKNE Lab Manual">
<meta property="og:description" content="คอร์สเตรียมสอบ CKNE แบบ hands-on ครบทั้ง 5 domain เริ่มจากศูนย์ได้ มีกล่องปูพื้นฐานทุกหัวข้อ">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128752;</text></svg>">
<style>:root{color-scheme:light dark}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>CKNE Lab Manual</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f2f4f6; --surface:#ffffff; --surface-2:#e9edf1; --border:#d4dbe2;
  --text:#1a2430; --text-dim:#5b6b7a;
  --accent:#b6791f; --accent-soft:#f3e3c8; --accent-ink:#ffffff;
  --flow:#1f7a8c; --flow-soft:#dcedf0;
  --good:#2f7d4f; --good-soft:#e1f3e6;
  --bad:#b23a34; --bad-soft:#fbe4e1;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 6px 20px rgba(20,30,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161d; --surface:#161e27; --surface-2:#1d2732; --border:#2b3742;
    --text:#e7edf2; --text-dim:#93a2af;
    --accent:#e8a33d; --accent-soft:#3a2e17; --accent-ink:#161000;
    --flow:#5cc3d6; --flow-soft:#16323a;
    --good:#56c17f; --good-soft:#123322;
    --bad:#e2685f; --bad-soft:#3a1c1a;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#10161d; --surface:#161e27; --surface-2:#1d2732; --border:#2b3742;
  --text:#e7edf2; --text-dim:#93a2af;
  --accent:#e8a33d; --accent-soft:#3a2e17; --accent-ink:#161000;
  --flow:#5cc3d6; --flow-soft:#16323a;
  --good:#56c17f; --good-soft:#123322;
  --bad:#e2685f; --bad-soft:#3a1c1a;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Thai",system-ui,"Segoe UI",sans-serif;line-height:1.55;font-size:16px}
h1,h2,h3,h4{font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-weight:700;text-wrap:balance;margin:0 0 .5em}
code,.mono,pre,.cmd{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
a{color:var(--flow)}
::selection{background:var(--accent-soft)}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);grid-template-rows:56px 1fr;grid-template-areas:"top top" "side main";min-height:100vh}
@media (max-width:820px){.app{grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "main"}.sidebar{position:fixed;inset:56px 0 0 0;transform:translateX(-100%);transition:transform .25s ease;z-index:40;background:var(--bg)}.sidebar.open{transform:translateX(0)}}
.topbar{grid-area:top;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:30;min-width:0}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em;white-space:nowrap;cursor:pointer;background:none;border:none;color:var(--text);font-family:inherit;font-size:1rem;flex:none}
@media (max-width:560px){.topbar{gap:9px;padding:0 10px}.brand-name{display:none}.theme-btn{padding:6px 8px}}
.brand .mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:"IBM Plex Mono";font-weight:700;font-size:.8rem}
.progress-strip{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.progress-track{flex:1;height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.progress-label{font-family:"IBM Plex Mono";font-size:.78rem;color:var(--text-dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.menu-btn{display:none;background:none;border:1px solid var(--border);border-radius:8px;width:34px;height:34px;color:var(--text);cursor:pointer;font-size:1rem}
@media (max-width:820px){.menu-btn{display:block}}
.theme-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:6px 10px;color:var(--text-dim);cursor:pointer;font-family:"IBM Plex Mono";font-size:.75rem}
.sidebar{grid-area:side;border-right:1px solid var(--border);background:var(--surface);overflow-y:auto;padding:14px 10px 40px}
.side-group{margin-bottom:4px}
.side-mod{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 8px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.88rem;font-weight:600}
.side-mod:hover{background:var(--surface-2)}
.side-mod .num{font-family:"IBM Plex Mono";font-size:.72rem;color:var(--text-dim);width:20px;flex:none}
.side-mod .w{margin-left:auto;font-family:"IBM Plex Mono";font-size:.68rem;color:var(--text-dim);background:var(--surface-2);border-radius:99px;padding:2px 7px}
.side-topics{padding-left:32px;margin:2px 0 8px;display:flex;flex-direction:column;gap:1px}
.side-topic{display:flex;align-items:center;gap:8px;text-align:left;background:none;border:none;color:var(--text-dim);padding:6px 8px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:.82rem}
.side-topic:hover{background:var(--surface-2);color:var(--text)}
.side-topic.active{background:var(--accent-soft);color:var(--text);font-weight:600}
.side-topic .dot{width:7px;height:7px;border-radius:99px;background:var(--border);flex:none}
.side-topic.done .dot{background:var(--good)}
.side-topic.partial .dot{background:var(--accent)}
main{grid-area:main;min-width:0;padding:28px 32px 80px;max-width:880px;margin:0 auto;width:100%}
@media (max-width:600px){main{padding:20px 16px 60px}}
.eyebrow{font-family:"IBM Plex Mono";font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-dim)}
.h1{font-size:1.7rem;margin-top:.2em}
.lede{color:var(--text-dim);max-width:65ch}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.section{margin-top:28px}
.concept{padding:20px 22px}
.concept p{margin:.6em 0}
.concept ul{margin:.5em 0;padding-left:1.3em}
.concept li{margin:.3em 0}
.concept code{background:var(--surface-2);border-radius:4px;padding:.1em .4em;font-size:.88em}
/* ชื่อ flag/field ยาวๆ เป็นคำเดียวไม่มีช่องว่าง ต้องยอมให้ตัดบรรทัดได้ ไม่งั้นดันหน้าล้นที่จอแคบ */
.concept code, .primer-body code, .lede code{overflow-wrap:anywhere}
figure{margin:0;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px 10px;box-shadow:var(--shadow)}
figure svg{width:100%;height:auto;display:block}
figcaption{font-size:.82rem;color:var(--text-dim);margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.lab{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.lab-head{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.lab-head .tag{font-family:"IBM Plex Mono";font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:5px;padding:3px 8px;font-weight:600}
.lab-head h3{margin:0;font-size:1.02rem}
.lab-prereq{padding:10px 18px;font-size:.85rem;color:var(--text-dim);border-bottom:1px dashed var(--border)}
.step{padding:16px 18px;border-bottom:1px solid var(--border)}
.step:last-of-type{border-bottom:none}
.step-head{display:flex;align-items:flex-start;gap:10px}
.step-check{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--good);cursor:pointer}
.step-num{font-family:"IBM Plex Mono";font-size:.75rem;color:var(--text-dim);flex:none;padding-top:2px}
.step-body{flex:1;min-width:0}
.step-instr{font-size:.92rem;margin-bottom:8px}
.cmd-block{background:#0d1319;border:1px solid #26313c;border-radius:8px;overflow:hidden}
.cmd-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 7px 5px 13px;border-bottom:1px solid #26313c;background:#121a22}
.cmd-lang{font-family:"IBM Plex Mono";font-size:.64rem;letter-spacing:.09em;text-transform:uppercase;color:#5d6f7e}
.cmd-scroll{overflow-x:auto}
.cmd-scroll pre{margin:0;padding:12px 14px;color:#d9e6ee;font-size:.82rem;white-space:pre}
.copy-btn{background:#1d2732;border:1px solid #2b3742;color:#93a2af;border-radius:6px;font-family:"IBM Plex Mono";font-size:.68rem;padding:4px 9px;cursor:pointer;flex:none}
.copy-btn:hover{color:#e7edf2;border-color:#3d4b58}
.disclose{margin-top:8px}
.disclose summary{font-size:.78rem;color:var(--text-dim);cursor:pointer;font-family:"IBM Plex Mono";list-style:none}
.disclose summary::-webkit-details-marker{display:none}
.disclose summary:before{content:"▸ "}
.disclose[open] summary:before{content:"▾ "}
.disclose .box{margin-top:6px;padding:10px 12px;border-radius:7px;font-size:.82rem}
.disclose.expect .box{background:var(--good-soft);color:var(--text)}
.disclose.trouble .box{background:var(--bad-soft);color:var(--text)}
.challenge{margin:0;padding:16px 18px;background:var(--accent-soft)}
.challenge h4{margin:0 0 6px;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;font-family:"IBM Plex Mono"}
.challenge .reveal-btn{margin-top:10px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-size:.8rem;cursor:pointer;color:var(--text)}
.primer{margin-top:18px;border:1px solid var(--flow);border-left-width:3px;border-radius:12px;background:var(--flow-soft);overflow:hidden}
.primer>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.primer>summary::-webkit-details-marker{display:none}
.primer>summary::before{content:"▸";font-family:"IBM Plex Mono";color:var(--flow);flex:none}
.primer[open]>summary::before{content:"▾"}
.primer .p-tag{font-family:"IBM Plex Mono";font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;background:var(--flow);color:var(--bg);border-radius:5px;padding:3px 8px;font-weight:600;flex:none}
.primer .p-need{font-size:.87rem;flex:1;min-width:180px}
.primer .p-count{font-family:"IBM Plex Mono";font-size:.7rem;color:var(--text-dim);flex:none}
.primer-body{padding:0 16px 16px;border-top:1px solid var(--border)}
.primer-body>p:first-child{margin-top:14px}
.primer-body p{margin:.6em 0;font-size:.93rem}
.primer-body ul{margin:.5em 0;padding-left:1.3em;font-size:.93rem}
.primer-body li{margin:.35em 0}
.primer-body code{background:var(--surface);border-radius:4px;padding:.1em .4em;font-size:.88em}
.primer-body figure{margin:14px 0;background:var(--surface)}
.p-try{margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.p-try-head{font-family:"IBM Plex Mono";font-size:.68rem;letter-spacing:.07em;text-transform:uppercase;color:var(--text-dim);padding:9px 13px;border-bottom:1px solid var(--border)}
.p-step{display:flex;align-items:flex-start;gap:9px;padding:12px 13px;border-bottom:1px solid var(--border)}
.p-step:last-child{border-bottom:none}
.p-step input{margin-top:3px;width:17px;height:17px;flex:none;accent-color:var(--flow);cursor:pointer}
.p-step-body{flex:1;min-width:0}
.p-step-instr{font-size:.88rem;margin-bottom:7px}
.p-step-expect{font-size:.8rem;color:var(--text-dim);margin-top:7px}
.mark-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px;padding-top:18px;border-top:1px solid var(--border)}
.mark-btn{background:var(--good);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;font-size:.88rem}
.mark-btn.done{background:var(--surface-2);color:var(--text-dim)}
.nav-btns{display:flex;gap:8px;flex-wrap:wrap;min-width:0}
.nav-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:9px 14px;cursor:pointer;color:var(--text);font-size:.85rem;min-width:0;text-align:left}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:"IBM Plex Mono";font-size:.68rem;border-radius:99px;padding:3px 9px;background:var(--surface-2);color:var(--text-dim)}
.grid-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-top:18px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;box-shadow:var(--shadow);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px}
.tile:hover{border-color:var(--accent)}
.tile-top{display:flex;justify-content:space-between;align-items:flex-start}
.tile .ring{width:40px;height:40px;flex:none}
.tile h3{font-size:.95rem;margin:0}
.tile p{margin:0;font-size:.78rem;color:var(--text-dim)}
.tile .stat{font-family:"IBM Plex Mono";font-size:.7rem;color:var(--text-dim);margin-top:auto}
.dash-hero{display:flex;gap:24px;flex-wrap:wrap;align-items:center;justify-content:space-between;padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.dash-stat{font-family:"IBM Plex Mono"}
.dash-stat .n{font-size:2.4rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.dash-stat .l{font-size:.72rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em}
.bp-chart{display:flex;flex-direction:column;gap:8px;min-width:260px;flex:1}
.bp-row{display:grid;grid-template-columns:150px 1fr 40px;align-items:center;gap:8px;font-size:.78rem}
.bp-row .lbl{color:var(--text-dim)}
.bp-bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bp-bar i{display:block;height:100%;background:var(--flow);border-radius:99px}
.bp-row .pct{font-family:"IBM Plex Mono";text-align:right;color:var(--text-dim)}
.quiz-q{padding:18px;border-bottom:1px solid var(--border)}
.quiz-q:last-child{border-bottom:none}
.quiz-q p.qtext{font-weight:600;margin:0 0 10px}
.opt{display:flex;align-items:flex-start;gap:9px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:.88rem}
.opt:hover{border-color:var(--flow)}
.opt.correct{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt input{margin-top:2px}
.qexplain{display:none;margin-top:8px;font-size:.82rem;color:var(--text-dim);background:var(--surface-2);border-radius:7px;padding:9px 11px}
.qexplain.show{display:block}
.quiz-submit{margin:18px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer}
.quiz-result{margin:0 18px 18px;font-family:"IBM Plex Mono";font-size:.85rem}
.footer-note{margin-top:50px;padding-top:16px;border-top:1px solid var(--border);color:var(--text-dim);font-size:.78rem}
svg text{fill:currentColor;font-family:"IBM Plex Mono"}
.diagram-accent{color:var(--flow)}
.diagram-accent2{color:var(--accent)}
</style>

<div class="app" id="app">
  <div class="topbar">
    <button class="menu-btn" id="menuBtn">☰</button>
    <button class="brand" id="brandBtn"><span class="mark">CK</span><span class="brand-name">CKNE Lab Manual</span></button>
    <div class="progress-strip">
      <div class="progress-track"><div class="progress-fill" id="topProgressFill" style="width:0%"></div></div>
      <span class="progress-label" id="topProgressLabel">0% พร้อมสอบ</span>
    </div>
    <button class="theme-btn" id="themeBtn">โหมดสี</button>
  </div>
  <nav class="sidebar" id="sidebar"></nav>
  <main id="main"></main>
</div>

<script>
/* ============ DATA ============ */
const MODULES = [
{
  id:"m0", short:"Lab Setup", title:"Module 0 · เตรียม Lab Environment", weight:0,
  blurb:"สร้างคลัสเตอร์จริงไว้รันแล็บทุกโมดูลในคอร์สนี้ ทุกแล็บใช้ Cilium เป็น CNI หลักตลอดทั้งคอร์ส เพราะ Cilium ครอบคลุม feature ที่ CKNE blueprint ต้องการเกือบทั้งหมดในตัวเดียว: CNI/IPAM, kube-proxy replacement, NetworkPolicy แบบ L7/DNS-aware, Gateway API, egress gateway, ClusterMesh, WireGuard encryption และ Hubble observability",
  topics:[
    {
      id:"m0-t1", title:"ติดตั้ง kind cluster + Cilium", summary:"สร้าง multi-node cluster ด้วย kind แล้วติดตั้ง Cilium แทน CNI default",
      primer:{
        need:"ยังไม่เคยใช้ Kubernetes มาก่อน หรือไม่ชัดเรื่อง IP / port / DNS? เริ่มอ่านตรงนี้ก่อน",
        diagram:"k8sObjects",
        body:`<p><strong>Kubernetes (k8s)</strong> คือระบบที่คอยรันและดูแล container ให้เราแทนการ ssh เข้าไปสั่งเองทีละเครื่อง — เราบอกว่า "อยากได้ nginx 3 ตัว" แล้วมันจัดการหาที่วาง เปิดใหม่เมื่อตาย และกระจายโหลดให้เอง</p>
        <p><strong>ศัพท์ที่ต้องรู้ก่อน (เรียงจากเล็กไปใหญ่)</strong></p>
        <ul>
          <li><strong>container</strong> — แอปหนึ่งตัวพร้อมของที่มันต้องใช้ ห่อมาเป็นก้อนเดียว</li>
          <li><strong>pod</strong> — หน่วยเล็กที่สุดที่ k8s จัดการ ข้างในมี container 1 ตัว (หรือมากกว่า) <strong>pod หนึ่งตัวได้ IP หนึ่งเบอร์</strong> — จุดนี้สำคัญมากกับทั้งคอร์สนี้</li>
          <li><strong>node</strong> — เครื่อง (VM หรือ server จริง) ที่ pod ไปรันอยู่</li>
          <li><strong>cluster</strong> — node หลายตัวรวมกัน คือทั้งระบบที่เราคุยด้วยผ่าน kubectl</li>
          <li><strong>namespace</strong> — โฟลเดอร์เสมือนไว้แบ่งกลุ่มของในคลัสเตอร์ ไม่ให้ชื่อชนกัน</li>
          <li><strong>Deployment</strong> — ตัวสั่งว่า "ขอ pod แบบนี้ n ตัว" และคอยสร้างใหม่ให้เมื่อมีตัวตาย</li>

        </ul>
        <p><strong>kubectl</strong> คือคำสั่งที่ใช้คุยกับคลัสเตอร์ รูปแบบที่เจอบ่อยสุดคือ <code>kubectl &lt;กริยา&gt; &lt;ชนิดของ&gt; &lt;ชื่อ&gt;</code> เช่น <code>kubectl get pod web</code>, <code>kubectl describe node</code>, <code>kubectl delete svc web</code> — เติม <code>-n &lt;namespace&gt;</code> เพื่อระบุ namespace และ <code>-o wide</code> เพื่อขอรายละเอียดเพิ่ม (เช่น IP)</p>
        <p><strong>YAML manifest</strong> ที่เห็นในแล็บทุกอันมีโครงเดียวกัน 4 ส่วน: <code>apiVersion</code> (เวอร์ชันของ API), <code>kind</code> (ชนิดของที่จะสร้าง), <code>metadata</code> (ชื่อ/namespace/label), <code>spec</code> (รายละเอียดว่าต้องการอะไร) — อ่านจากบนลงล่างตามนี้แล้วจะไม่หลง</p>
        <p><strong>ฝั่ง network ที่ต้องรู้ 4 อย่าง</strong></p>
        <ul>
          <li><strong>IP</strong> — เลขประจำตัวของเครื่อง/pod ใช้ระบุว่าจะส่งข้อมูลไปหาใคร</li>
          <li><strong>port</strong> — เลขช่องบนเครื่องนั้น บอกว่าจะคุยกับโปรแกรมตัวไหน (เว็บมักอยู่ 80/443)</li>
          <li><strong>DNS</strong> — ระบบแปลงชื่อเป็น IP เพราะคนจำชื่อง่ายกว่าจำเลข</li>
          <li><strong>TCP vs UDP</strong> — TCP ต่อสายก่อนคุยและรับประกันว่าข้อมูลถึงครบ (เว็บ/API ใช้ตัวนี้) ส่วน UDP ยิงทิ้งไม่รับประกัน แต่เร็วกว่า (DNS ใช้ตัวนี้)</li>
        </ul>`,

        body:`<p>เวลาเขียน IP แบบมี <code>/</code> ต่อท้าย เช่น <code>10.244.0.0/16</code> เราไม่ได้พูดถึง IP เบอร์เดียว แต่พูดถึง <strong>ช่วงของ IP</strong> — รูปแบบนี้เรียกว่า <strong>CIDR</strong></p>

          <li><code>/16</code> ล็อก 16 บิต เหลือ 16 บิต → 2¹⁶ = <strong>65,536 เบอร์</strong></li>
          <li>จำง่ายๆ: <strong>ตัวเลขยิ่งมาก ช่วงยิ่งแคบ</strong> — /32 คือเบอร์เดียวเป๊ะ</li>

        <p>k8s ใช้หลักนี้แบ่งงาน: ให้ช่วงใหญ่ (/16) กับทั้งคลัสเตอร์ แล้วซอยเป็นก้อนเล็ก (/24) แจกให้แต่ละ node ไปแจกต่อให้ pod ของตัวเอง — วิธีนี้ทำให้ node แต่ละตัวแจก IP ได้เองโดยไม่ต้องถามใคร และรับประกันว่าไม่ชนกัน</p>`,
        try:[

          {i:"สร้าง pod แล้วดูว่า IP ที่ได้ตกอยู่ในช่วงของ node ที่มันไปอยู่จริงไหม", c:"kubectl run cidrtest --image=nginx\nkubectl get pod cidrtest -o wide", e:"คอลัมน์ IP ของ pod อยู่ในช่วง /24 ของ node ที่แสดงในคอลัมน์ NODE"}

      },
      concept:`<p><strong>IPAM (IP Address Management)</strong> คือกลไกที่ CNI plugin ใช้แจก IP ให้ pod แต่ละตัวโดยไม่ชนกัน มี 3 ช่วง CIDR ที่ต้องแยกให้ออกเพราะข้อสอบชอบถามสลับกัน</p>
      <ul>
        <li><strong>Pod CIDR</strong> — ช่วง IP ของ pod ทั้งคลัสเตอร์ (เช่น 10.244.0.0/16) มักถูกแบ่งย่อยเป็น per-node block (เช่น /24 ต่อ node)</li>
        <li><strong>Service CIDR</strong> — ช่วง virtual IP ของ ClusterIP Service (บน kind คือ 10.96.0.0/16) ไม่มี route จริง เป็นแค่ VIP ที่ kube-proxy/eBPF ทำ DNAT</li>
        <li><strong>Cluster CIDR</strong> — บางเอกสารใช้คำนี้แทน Pod CIDR ต้องดู context</li>
        <li>Cilium ใช้ <strong>CiliumNode</strong> CRD เก็บ IPAM allocation ต่อ node แทนที่จะพึ่ง kube-controller-manager เพียงอย่างเดียว (โหมด cluster-pool)</li>
      </ul>`,

          {i:"ดู IP ที่ pod แต่ละตัวได้รับจริงเทียบกับ pod CIDR ของ node นั้น", c:"kubectl get pods -o wide | grep netcheck", e:"IP ของ pod netcheck ต้องอยู่ในช่วง CIDR ของ node ที่มันรันอยู่ (เช่น 10.244.1.5)", tr:"ถ้า IP อยู่นอกช่วง อาจเป็นเพราะ config podSubnet ตอนสร้าง kind cluster ไม่ตรงกับที่ Cilium ตั้งไว้"},

    { id:"m1-t3", title:"Linux Networking Primitives", summary:"netns, veth, bridge, iptables/nftables คือชิ้นส่วนที่ CNI ประกอบขึ้นมาเป็น pod network",
      primer:{
        need:"interface คืออะไร แล้ว \"network namespace\" ต่างจากเครื่องธรรมดายังไง",
        body:`<p><strong>network interface</strong> คือ "ช่องต่อสาย" ของเครื่อง — การ์ดแลนจริงชื่อมักเป็น <code>eth0</code>, ส่วน <code>lo</code> (loopback) คือช่องที่วนกลับหาตัวเอง ทุก interface ถือ IP ได้</p>
        <p>ลองอ่านผลของ <code>ip addr</code> แบบย่อ: บรรทัดที่ขึ้นต้นด้วยเลขคือชื่อ interface, คำว่า <code>UP</code> แปลว่าเปิดใช้งานอยู่, บรรทัด <code>inet</code> ข้างใต้คือ IP ที่ interface นั้นถืออยู่</p>
        <p><strong>network namespace (netns)</strong> คือลูกเล่นของ Linux ที่ทำให้เครื่องเดียวมี "ชุด network แยกกัน" ได้หลายชุด — แต่ละชุดมี interface, IP, routing table และกฎ firewall เป็นของตัวเอง มองไม่เห็นกัน</p>
        <ul>
          <li>นี่คือเหตุผลที่ <strong>pod แต่ละตัวมี IP ของตัวเองและมี eth0 ของตัวเอง</strong> ทั้งที่อยู่เครื่องเดียวกัน — เพราะแต่ละ pod ถูกใส่ไว้คนละ netns</li>
          <li>ข้อดีที่ตามมาคือ pod สองตัวบนเครื่องเดียวกันเปิด port 80 พร้อมกันได้ ไม่ชนกัน เพราะเป็นคนละชุด network</li>
          <li><strong>veth pair</strong> คือสายเสมือนที่มีสองหัว ใช้ต่อ netns ของ pod เข้ากับ network ของเครื่องหลัก (เนื้อหาหลักด้านล่างจะพาไปดูของจริง)</li>
        </ul>`,
        try:[
          {i:"ดู interface ของเครื่องตัวเอง (root namespace) — จะเห็นทั้ง lo และการ์ดแลนจริง", c:"ip addr | grep -E '^[0-9]+:|inet '", e:"เห็นอย่างน้อย lo (127.0.0.1) และ interface หลักที่ถือ IP ของเครื่อง"},
          {i:"ดู interface ที่ pod มองเห็น — สังเกตว่ามันเห็นแค่ eth0 ของตัวเอง ไม่เห็นของเครื่องเลย", c:"kubectl run nstest --image=nicolaka/netshoot --command -- sleep 600\nkubectl exec nstest -- ip addr | grep -E '^[0-9]+:|inet '", e:"เห็นแค่ lo กับ eth0 ที่ถือ IP ของ pod เอง — นี่คือผลของการอยู่คนละ netns"}
        ]
      },
      concept:`<p>ไม่ว่า CNI plugin ไหนก็ยืนอยู่บนกลไก Linux kernel ชุดเดียวกัน เข้าใจสิ่งเหล่านี้แล้วจะ debug ปัญหา networking ได้ไม่ว่าใช้ CNI ตัวไหน</p>
      <ul>
        <li><strong>Network namespace (netns)</strong> — sandbox แยก network stack ต่อ pod มี interface/routing table/iptables ของตัวเอง</li>
        <li><strong>veth pair</strong> — interface คู่เชื่อม netns ของ pod เข้ากับ root namespace ของ node เหมือนสาย cable เสมือน</li>
        <li><strong>Linux bridge / eBPF hook</strong> — CNI แบบเก่า (bridge, Flannel) ต่อ veth เข้า bridge ส่วน Cilium attach eBPF program ตรงที่ veth แทนการใช้ bridge</li>
        <li><strong>iptables/nftables</strong> — ใช้ทำ NAT, filtering; Cilium เลี่ยงส่วนนี้เกือบทั้งหมดด้วย eBPF ทำให้เร็วกว่าที่ scale ใหญ่</li>
      </ul>`,
      lab:{ title:"ไล่ดู netns และ veth pair ของ pod จริงด้วยมือ",
        steps:[
          {i:"หา PID ของ container ที่ pod netcheck ใช้ผ่าน crictl บน node ที่มันรันอยู่", c:"docker exec -it ckne-worker crictl ps | grep netcheck\ndocker exec -it ckne-worker crictl inspect <container-id> | grep -i pid", e:"ได้เลข PID ของ process หลักใน container นั้น", tr:"ถ้า crictl ไม่มีสิทธิ์ ให้ลองต่อท้ายด้วย sudo หรือเช็คว่า containerd socket path ถูกต้อง (--runtime-endpoint)"},
          {i:"ใช้ nsenter เข้าไปดู network namespace ของ pod นั้นโดยตรงจากฝั่ง node", c:"docker exec -it ckne-worker nsenter -t <PID> -n ip addr", e:"เห็น interface eth0 พร้อม IP ที่ตรงกับ kubectl get pod -o wide", tr:"ถ้า error 'no such process' แปลว่า PID ผิด หรือ container restart ไปแล้ว ให้ดึง PID ใหม่"},
          {i:"หาปลายอีกด้านของ veth pair บนฝั่ง root namespace ของ node", c:"docker exec -it ckne-worker nsenter -t <PID> -n ethtool -S eth0 | grep peer_ifindex\ndocker exec -it ckne-worker ip link | grep '<ifindex ที่ได้>:'", e:"เจอ interface ชื่อ lxcXXXX หรือคล้ายกันบน node ที่ index ตรงกับ peer_ifindex", tr:"ถ้า ethtool ไม่มีในเครื่อง node ให้ apt/apk install ethtool ก่อน หรือดูผ่าน /sys/class/net/eth0/iflink แทน"}
        ],
        challenge:{ task:"อธิบายเป็นข้อๆ ว่า packet เดินทางจาก process ใน pod จนถึง network card จริงของเครื่อง (physical NIC) ผ่านกี่ชั้น อะไรบ้าง", reveal:"process → socket → eth0 ใน netns ของ pod → veth pair → (lxc interface ฝั่ง root netns) → eBPF program ของ Cilium ตัดสินใจ (local pod, route ไป node อื่น หรือออก external) → ถ้าไปไกลกว่า node ต้องผ่าน routing table/VXLAN encapsulation ของ root netns → physical NIC"}
      }
    },
    { id:"m1-t4", title:"Pod-to-Pod Connectivity: Overlay vs Native Routing", summary:"สอง pod คุยกันข้าม node ได้อย่างไร — ผ่าน tunnel (overlay) หรือ route ตรง (BGP)",
      diagram:"cniPath",
      primer:{
        need:"\"routing\" กับ \"encapsulation\" คืออะไร เอาไปใช้ทำอะไร",
        body:`<p><strong>routing</strong> คือการตัดสินใจว่า "ข้อมูลก้อนนี้ต้องส่งออกทางไหนต่อ" ทุกเครื่องมีตารางเส้นทาง (routing table) ไว้เทียบว่า IP ปลายทางตรงกับกติกาข้อไหน แล้วส่งออกตามนั้น ถ้าไม่ตรงข้อไหนเลยก็ส่งไป <strong>default gateway</strong> (ทางออกเริ่มต้น)</p>
        <p><strong>encapsulation</strong> แปลตรงตัวว่า "ห่อ" — คือเอาแพ็กเก็ตเดิมทั้งก้อนใส่ซองใหม่แล้วจ่าหน้าใหม่ไว้ข้างนอก เหมือนเอาจดหมายที่จ่าถึงเพื่อน ไปใส่ซองอีกใบที่จ่าถึงไปรษณีย์สาขาปลายทาง พอถึงแล้วค่อยแกะซองนอกออก จดหมายข้างในยังเหมือนเดิม</p>
        <ul>
          <li>ปัญหาที่ต้องแก้: เครือข่ายจริงขององค์กร<strong>ไม่รู้จัก IP ของ pod</strong> เพราะเป็นเลขที่ k8s สมมติขึ้นมาเอง ส่งตรงๆ ไปก็หลงทาง</li>
          <li><strong>ทางแก้ที่ 1 — overlay</strong>: ห่อซองใหม่จ่าหน้าด้วย IP ของ node (ซึ่งเครือข่ายจริงรู้จัก) ส่งข้าม node แล้วค่อยแกะ — ไม่ต้องขออะไรจากทีม network เลย แลกกับงานตอนห่อ/แกะ</li>
          <li><strong>ทางแก้ที่ 2 — native routing</strong>: ไปบอกอุปกรณ์เครือข่ายจริงให้รู้จัก IP ของ pod ซะเลย (ผ่าน BGP) แล้วส่งตรงได้ไม่ต้องห่อ — เร็วกว่า แต่ต้องคุยกับทีม network</li>
        </ul>`,
        try:[
          {i:"ดูตารางเส้นทางของเครื่อง — บรรทัด default คือทางออกเมื่อไม่ตรงกติกาข้ออื่น", c:"ip route", e:"เห็นบรรทัดขึ้นต้นด้วย default ตามด้วยกติกาเฉพาะของแต่ละช่วง IP"},
          {i:"ดูว่าคลัสเตอร์นี้เลือกวิธีไหนส่งข้าม node (tunnel = ห่อซอง, native = ส่งตรง)", c:"kubectl -n kube-system get cm cilium-config -o jsonpath='{.data.routing-mode}{\"\\n\"}'", e:"ได้คำว่า tunnel แปลว่าคลัสเตอร์นี้ใช้วิธีห่อซอง (VXLAN) ส่งข้าม node"}
        ]
      },
      concept:`<p>เมื่อ Pod A บน Node 1 คุยกับ Pod B บน Node 2 มี 2 แนวทางหลักที่ CNI plugin เลือกใช้</p>
      <ul>
        <li><strong>Overlay (encapsulation)</strong> — ห่อ packet เดิมด้วย header ใหม่ (VXLAN/GENEVE) แล้วส่งผ่าน node-to-node เหมือนอุโมงค์ ข้อดีคือไม่ต้องยุ่งกับ physical network routing เลย ข้อเสียคือมี overhead จากการ encap/decap</li>
        <li><strong>Native routing (BGP)</strong> — ประกาศ pod CIDR ของแต่ละ node ผ่าน BGP ให้ physical network รู้จัก แล้ว route ตรงแบบ L3 ไม่มี encapsulation ข้อดีคือเร็วกว่าและ debug ง่ายกว่าด้วย tool มาตรฐาน (traceroute เห็น hop จริง) ข้อเสียคือต้องมี BGP peer กับ network จริง</li>
        <li>Cilium เลือกได้ทั้งสองแบบผ่าน <code>routingMode: tunnel</code> (VXLAN, ค่า default) หรือ <code>routingMode: native</code> (ต้องมี BGP หรือ direct-routing)</li>
      </ul>`,
      lab:{ title:"ยิง traffic ข้าม node แล้วจับ packet บน overlay interface",
        prereqs:"ใช้ pod netcheck จาก topic ก่อนหน้า และสร้าง pod ที่สองบน node อื่น",
        steps:[
          {i:"บังคับสร้าง pod ที่สองให้ไปอยู่คนละ node กับ netcheck ด้วย node affinity แบบง่ายผ่าน nodeName", c:"kubectl get pod netcheck -o jsonpath='{.spec.nodeName}'\nkubectl run netcheck2 --image=nicolaka/netshoot --overrides='{\"spec\":{\"nodeName\":\"ckne-worker2\"}}' --command -- sleep 3600", e:"netcheck2 ถูก schedule ไปยัง ckne-worker2 ซึ่งเป็นคนละ node จาก netcheck", tr:"ถ้า overrides ไม่ทำงานบน kubectl version เก่า ให้เขียนเป็นไฟล์ YAML แล้ว kubectl apply -f แทน"},
          {i:"เปิด tcpdump ดัก VXLAN traffic (UDP port 8472) บน overlay interface ของ node ที่ netcheck รันอยู่", c:"# kindest/node ไม่มี tcpdump มาให้ ต้องติดตั้งก่อนครั้งแรก\ndocker exec -it ckne-worker sh -c 'command -v tcpdump || (apt-get update -qq && apt-get install -y -qq tcpdump)'\ndocker exec -it ckne-worker tcpdump -i any -n udp port 8472 -c 10", e:"ค้างรอ packet — ยังไม่เห็นอะไรจนกว่าจะมี traffic ข้าม node จริง", tr:"ถ้า apt-get ใช้ไม่ได้เพราะเครื่องไม่มีเน็ตออก ใช้ pod netshoot แทนได้: kubectl run tcpd --image=nicolaka/netshoot --overrides='{\"spec\":{\"hostNetwork\":true,\"nodeName\":\"ckne-worker\"}}' --command -- sleep 600 แล้ว exec tcpdump ข้างใน; ถ้า interface any ไม่รองรับ ลองระบุชื่อตรงๆ เช่น cilium_vxlan"},
          {i:"เปิด terminal ใหม่ ping จาก netcheck ไปยัง netcheck2 เพื่อ generate traffic ข้าม node", c:"kubectl exec netcheck -- ping -c 5 $(kubectl get pod netcheck2 -o jsonpath='{.status.podIP}')", e:"ได้ reply กลับมาสำเร็จ 5 ครั้ง latency ต่ำ (sub-millisecond ถึงหลัก ms บนเครื่อง local)", tr:"ถ้า ping ไม่สำเร็จ กลับไปเช็ค cilium status ว่า cluster mesh/agent ทุก node ยัง healthy"},

        <p><strong>load balancing</strong> คือการกระจายงานไปยังผู้รับหลายตัวไม่ให้กระจุกที่ตัวเดียว — วิธีเลือกที่พบบ่อยคือวนตามลำดับ (round robin) หรือเลือกตัวที่งานน้อยสุด (least connection)</p>
        <p>เอาสองเรื่องนี้มารวมกันจะได้ภาพของ Service: มี IP กลางหนึ่งเบอร์ (ClusterIP) ที่ไม่มี pod ตัวไหนถืออยู่จริง พอมีคนส่งของไปเบอร์นั้น ระบบจะ <strong>DNAT</strong> เปลี่ยนปลายทางเป็น pod จริงตัวใดตัวหนึ่ง โดยเลือกแบบ <strong>load balancing</strong> — ส่วนหัวข้อนี้คือเรื่องที่ว่า "ระบบ" ที่ว่านั้นเขียนกฎเก็บไว้ยังไงได้บ้าง</p>`,

        steps:[
          {i:"ยืนยันว่าไม่มี kube-proxy DaemonSet รันอยู่ (เพราะ Cilium ทำหน้าที่แทน)", c:"kubectl -n kube-system get ds kube-proxy\ncilium status | grep KubeProxyReplacement", e:"คำสั่งแรกได้ error \"not found\" และคำสั่งที่สองแสดง KubeProxyReplacement: True ยืนยันว่า eBPF รับหน้าที่แทนจริง", tr:"ถ้ายังเจอ kube-proxy DaemonSet อยู่ แปลว่า kind config ตอน Module 0 ไม่ได้ตั้ง kubeProxyMode: \"none\" (flag kubeProxyReplacement ฝั่ง Cilium ไม่ลบ DaemonSet ที่มีอยู่แล้วให้) ต้องสร้าง cluster ใหม่ หรือลบ DaemonSet ทิ้งเอง"},
          {i:"ดูรายการ Service ทั้งหมดที่ Cilium eBPF ทำ load balancing อยู่ในตัวมันเอง", c:"cilium service list", e:"เห็นตาราง ID / Frontend (VIP:port) / Backend (pod IP หลายตัว) ของ web-clusterip", tr:"ถ้า cilium CLI สั่งจากนอก pod ไม่ได้ ให้ kubectl -n kube-system exec -it ds/cilium -- cilium service list แทน"},
          {i:"เทียบความเร็วเชิงแนวคิด: ลองนับจำนวนกฎที่ Cilium ต้องอัปเดตเมื่อมี Service ใหม่ ผ่าน eBPF map แทน iptables chain", c:"cilium bpf lb list | wc -l", e:"ได้ตัวเลขรายการใน eBPF load-balancer map ซึ่งอัปเดตแบบ O(1) ต่อรายการ ไม่ต้องเขียนกฎใหม่ทั้ง chain", tr:"ถ้าคำสั่งไม่รู้จัก ตรวจ version ของ cilium CLI ให้ตรงกับ agent version"}
        ],
        challenge:{ task:"ทำไมทีมที่มี Service มากกว่า 5,000 ตัวถึงมักเลี่ยง iptables mode โดยเด็ดขาด", reveal:"iptables ประเมินกฎแบบ linear scan ต่อ chain ทำให้ latency การ match กฎเพิ่มขึ้นตามจำนวน Service/endpoint เชิงเส้น (O(n)) ที่ scale หลักพันจะเห็น packet processing latency สูงขึ้นชัดเจนและ kube-proxy sync เวลานานขึ้นทุกครั้งที่ endpoint เปลี่ยน ส่วน IPVS และ eBPF ใช้ hash table/map lookup ที่คงที่ (O(1)) ไม่ว่าจำนวน Service จะเยอะแค่ไหน"}
      }
    },
    { id:"m2-t3", title:"CoreDNS: Corefile และ Service Discovery", summary:"ทุก pod หา Service เจอได้เพราะ CoreDNS — ปรับ Corefile อย่างไรให้ resolve โดเมนพิเศษได้",
      diagram:"coreDns",
      primer:{
        need:"DNS แปลงชื่อเป็น IP ได้ยังไง แล้ว FQDN คืออะไร",
        body:`<p>คอมพิวเตอร์คุยกันด้วย IP แต่คนจำชื่อได้ง่ายกว่า <strong>DNS</strong> คือสมุดโทรศัพท์ที่แปลงชื่อเป็น IP ให้</p>
        <p>ลำดับที่เกิดขึ้นเวลาโปรแกรมจะต่อไปที่ <code>web-clusterip</code>:</p>
        <ul>
          <li>โปรแกรมถามระบบว่า "ชื่อนี้ IP อะไร"</li>
          <li>ระบบเปิดไฟล์ <code>/etc/resolv.conf</code> ดูว่าต้องไปถาม DNS server เครื่องไหน</li>
          <li>ยิงคำถามไปหา DNS server นั้น (ปกติใช้ UDP port 53)</li>
          <li>ได้ IP กลับมา แล้วค่อยเริ่มต่อจริง</li>
        </ul>
        <p><strong>FQDN (Fully Qualified Domain Name)</strong> คือชื่อเต็มที่ไม่กำกวม เช่น <code>web-clusterip.default.svc.cluster.local</code> — อ่านจากซ้ายไปขวาคือ ชื่อ Service → namespace → ประเภท → โดเมนของคลัสเตอร์</p>
        <p>ใน pod เราพิมพ์แค่ชื่อสั้น <code>web-clusterip</code> ได้ เพราะใน <code>/etc/resolv.conf</code> มีบรรทัด <code>search</code> ที่ระบบจะเอาไปต่อท้ายให้อัตโนมัติจนกลายเป็นชื่อเต็ม — เป็นเหตุผลว่าทำไม pod ใน namespace เดียวกันเรียกกันด้วยชื่อสั้นได้ แต่ข้าม namespace ต้องเติมชื่อ namespace ด้วย</p>`,
        try:[
          {i:"เปิดดู resolv.conf ใน pod ว่าชี้ไป DNS server เครื่องไหน และมี search domain อะไรบ้าง", c:"kubectl exec dns-test -- cat /etc/resolv.conf", e:"บรรทัด nameserver คือ IP ของ CoreDNS และบรรทัด search คือชื่อที่ระบบจะเอาไปต่อท้ายชื่อสั้นให้อัตโนมัติ"},
          {i:"เทียบผลของชื่อสั้นกับชื่อเต็ม — ได้ IP เดียวกันไหม", c:"kubectl exec dns-test -- nslookup web-clusterip | tail -3\nkubectl exec dns-test -- nslookup web-clusterip.default.svc.cluster.local | tail -3", e:"ได้ IP เดียวกันทั้งคู่ เพราะชื่อสั้นถูกเติม search domain จนกลายเป็นชื่อเต็มตัวเดียวกัน"}
        ]
      },
      concept:`<p>CoreDNS เป็น DNS server แบบ plugin-chain รันเป็น Deployment ใน kube-system ให้บริการผ่าน Service ชื่อ <code>kube-dns</code> ตั้งค่าทั้งหมดอยู่ใน <strong>Corefile</strong> (ConfigMap)</p>
      <ul>
        <li><strong>kubernetes plugin</strong> — ตอบ query สำหรับ <code>*.svc.cluster.local</code> โดยอ่านจาก Service/EndpointSlice ใน apiserver โดยตรง</li>
        <li><strong>forward plugin</strong> — ส่ง query ที่ไม่ใช่โดเมนภายในคลัสเตอร์ต่อไปยัง upstream DNS (มักอ่านจาก <code>/etc/resolv.conf</code> ของ node)</li>
        <li><strong>cache plugin</strong> — cache คำตอบไว้ระยะสั้นลด load ต่อ apiserver</li>
        <li>Pod แต่ละตัวรู้จัก CoreDNS ผ่าน <code>/etc/resolv.conf</code> ที่ kubelet เขียนให้อัตโนมัติ ชี้ไปที่ kube-dns ClusterIP</li>
        <li>ค้นหาชื่อสั้นได้ (เช่น <code>web-clusterip</code> แทนชื่อเต็ม) เพราะมี <code>search</code> domain ต่อท้ายอัตโนมัติตาม namespace</li>
      </ul>`,
      lab:{ title:"แก้ Corefile เพิ่ม custom stub-domain แล้วพิสูจน์ด้วย dig",
        steps:[
          {i:"ดู Corefile ปัจจุบันก่อนแก้", c:"kubectl -n kube-system get configmap coredns -o yaml", e:"เห็น block .:53 ที่มี plugin errors, health, kubernetes, prometheus, forward, cache, loop, reload, loadbalance เรียงกัน", tr:"ถ้า configmap ชื่อไม่ตรง ลอง kubectl -n kube-system get cm | grep -i dns หาแทน"},
          {i:"เพิ่ม stub-domain ใหม่ที่ forward โดเมนสมมติ internal.corp ไปยัง DNS server อื่น (จำลองด้วย 8.8.8.8 ในแล็บ)", c:"kubectl -n kube-system edit configmap coredns\n# เพิ่ม block ใหม่ต่อท้าย Corefile:\n# internal.corp:53 {\n#     forward . 8.8.8.8\n# }", e:"save แล้ว CoreDNS reload อัตโนมัติภายในไม่กี่วินาที (plugin reload ตรวจ Corefile เปลี่ยนเอง)", tr:"ถ้าไม่ reload ให้ restart deployment ด้วยมือ: kubectl -n kube-system rollout restart deployment coredns"},
          {i:"ทดสอบ resolve โดเมนภายในคลัสเตอร์จากภายใน pod ด้วย dig", c:"kubectl exec dns-test -- dig +short web-clusterip.default.svc.cluster.local", e:"ได้ ClusterIP ของ web-clusterip กลับมาเป็นตัวเลข IP เดียว", tr:"ถ้า dig ไม่มีในเครื่อง image ให้ใช้ nslookup แทนได้ผลลัพธ์คล้ายกัน"},
          {i:"ยืนยันว่า stub-domain ใหม่ถูก route ผ่าน block ที่เพิ่มจริง โดยดู log ของ CoreDNS", c:"kubectl -n kube-system logs deployment/coredns --tail=20", e:"เห็น query log (ถ้าเปิด plugin log) แสดงว่า query โดเมน internal.corp ถูกจับคู่กับ block ใหม่ ไม่ใช่ block . เดิม", tr:"ถ้าไม่เห็น log เลย ให้เพิ่ม plugin log ในทุก block ของ Corefile ก่อน"}
        ],
        challenge:{ task:"ทำไมการเรียง block ใน Corefile ถึงมีผลต่อผลลัพธ์ — ถ้า block . (catch-all) มาก่อน block internal.corp จะเกิดอะไรขึ้น", reveal:"CoreDNS จับคู่ query กับ zone ที่ specific ที่สุดก่อนเสมอไม่ว่าจะเขียนเรียงลำดับใดในไฟล์ (เหมือน DNS zone matching ปกติ) แต่ถ้าตั้ง zone ซ้อนทับกันแบบกำกวม การเรียงอาจส่งผลต่อ plugin บางตัวที่ทำงานแบบ first-match เช่น rewrite หรือ template จึงควรเขียน zone เฉพาะเจาะจงกว่าไว้ก่อนเสมอเพื่อไม่ให้สับสน"}
      }
    },
    { id:"m2-t4", title:"Gateway API vs Ingress", summary:"มาตรฐานใหม่ที่แยก concern ระหว่างทีม infra กับทีม application ชัดเจนกว่า Ingress",
      diagram:"gatewayApi",
      primer:{
        need:"reverse proxy คืออะไร แล้ว \"routing ระดับ L7\" ต่างจากที่ผ่านมายังไง",
        body:`<p><strong>reverse proxy</strong> คือตัวกลางที่ยืนอยู่หน้าสุด รับ request จากภายนอกแล้วตัดสินใจว่าจะส่งต่อให้บริการตัวไหนข้างใน — ผู้ใช้เห็นแค่ที่อยู่เดียว แต่ข้างหลังอาจมีหลายสิบบริการ</p>
        <p>ความต่างที่สำคัญของหัวข้อนี้คือ <strong>ตัดสินใจโดยดูจากอะไร</strong></p>
        <ul>
          <li><strong>ระดับ L4</strong> (Service/kube-proxy ที่ผ่านมา) — เห็นแค่ IP กับ port เท่านั้น ตัดสินใจได้แค่ "ส่งไป pod ตัวไหนในกลุ่มนี้" มันไม่รู้ด้วยซ้ำว่าข้างในเป็น HTTP หรืออะไร</li>
          <li><strong>ระดับ L7</strong> (Ingress/Gateway API หัวข้อนี้) — แกะดูเนื้อใน HTTP ได้ จึงตัดสินใจจาก <strong>path</strong> (<code>/api</code> ไปบริการหนึ่ง <code>/images</code> ไปอีกบริการ), จาก <strong>host</strong> (ชื่อโดเมนที่เรียกเข้ามา) หรือจาก <strong>header</strong> ได้</li>
        </ul>
        <p>คำที่จะเจอบ่อยในหัวข้อนี้: <strong>path</strong> คือส่วนหลังชื่อโดเมนใน URL (<code>https://example.com<strong>/api/v1</strong></code>), <strong>header</strong> คือข้อมูลกำกับที่แนบมากับ request ที่คนทั่วไปมองไม่เห็น และ <strong>TLS termination</strong> คือการที่ตัวกลางเป็นคนถอดรหัส HTTPS ให้ บริการข้างหลังจึงรับเป็น HTTP ธรรมดาได้</p>`,
        try:[
          {i:"ดูว่า path ของ URL คือส่วนไหน โดยยิงไปที่ path ต่างกันบน nginx ตัวเดิม", c:"kubectl exec dns-test -- wget -qO- http://web-clusterip/ | head -4\nkubectl exec dns-test -- wget -qO- http://web-clusterip/ไม่มีหน้านี้ 2>&1 | head -3", e:"path แรกได้หน้าเว็บ ส่วน path ที่สองได้ 404 — เพราะ path เป็นส่วนที่ระบุว่าขออะไรบนเซิร์ฟเวอร์นั้น ซึ่ง L7 routing ใช้ตัดสินใจได้"},
          {i:"ดู header ที่แนบมากับ response (สิ่งที่ L7 อ่านได้แต่ L4 มองไม่เห็น)", c:"kubectl exec dns-test -- wget -qS -O /dev/null http://web-clusterip 2>&1 | head -6", e:"เห็นบรรทัด Server:, Content-Type: ฯลฯ — ข้อมูลระดับ L7 พวกนี้คือสิ่งที่ Gateway API เอามาใช้ตัดสินใจ routing ได้"}
        ]
      },
      concept:`<p><strong>Ingress</strong> เป็น API ดั้งเดิมของ k8s สำหรับ HTTP routing แต่มีข้อจำกัดสำคัญ: fields ที่ vendor-specific ต้องยัดใส่ annotation ทั้งหมด ทำให้พกพาข้าม implementation ไม่ได้ และไม่มีการแยกสิทธิ์ระหว่างทีม infra กับทีม dev ชัดเจน</p>
      <ul>
        <li><strong>GatewayClass</strong> — เทียบเท่า StorageClass บอกว่าใช้ controller ตัวไหน (เช่น cilium)</li>
        <li><strong>Gateway</strong> — คุมระดับ infrastructure: listener, port, TLS cert — ดูแลโดยทีม platform</li>
        <li><strong>HTTPRoute</strong> — คุมระดับ application: path matching, header matching, traffic split ระหว่าง Service — ดูแลโดยทีม dev เอง แยก namespace ได้</li>
        <li>Gateway API รองรับ <strong>traffic splitting</strong> โดย native (backendRefs พร้อม weight) ซึ่ง Ingress ต้องพึ่ง annotation เฉพาะ controller เท่านั้น</li>
        <li>CKNE ถามเรื่องนี้หนักเพราะเป็นทิศทางที่ k8s ผลักดันแทน Ingress ในระยะยาว</li>
      </ul>`,
      lab:{ title:"ติดตั้ง Gateway API แล้วทำ path-based routing เทียบกับ Ingress",
        prereqs:"ใช้ Cilium ที่รองรับ Gateway API (เปิดผ่าน --set gatewayAPI.enabled=true ตอนติดตั้ง หรือ helm upgrade เพิ่ม flag นี้)",
        steps:[
          {i:"ติดตั้ง Gateway API CRDs (standard channel) และเปิดใช้ฝั่ง Cilium", c:"kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.1.0/standard-install.yaml\nhelm upgrade cilium cilium/cilium --version 1.15.6 -n kube-system --reuse-values --set gatewayAPI.enabled=true", e:"CRD ชื่อ gateways.gateway.networking.k8s.io และ httproutes.gateway.networking.k8s.io ถูกสร้าง, Cilium operator restart แล้วขึ้น Running", tr:"ถ้า Cilium ไม่ reconcile Gateway ให้เช็ค kubectl -n kube-system logs deployment/cilium-operator หา error เกี่ยวกับ gatewayAPI"},
          {i:"สร้าง Gateway ที่เปิด listener HTTP พอร์ต 80", c:"cat <<EOF | kubectl apply -f -\napiVersion: gateway.networking.k8s.io/v1\nkind: Gateway\nmetadata:\n  name: web-gw\nspec:\n  gatewayClassName: cilium\n  listeners:\n  - name: http\n    protocol: HTTP\n    port: 80\nEOF", e:"kubectl get gateway web-gw แสดง status Programmed: True หลังผ่านไปไม่กี่วินาที", tr:"ถ้า Programmed เป็น False ให้ kubectl describe gateway web-gw ดู condition message"},
          {i:"สร้าง HTTPRoute จับคู่ path /web ไปยัง web-clusterip", c:"cat <<EOF | kubectl apply -f -\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata:\n  name: web-route\nspec:\n  parentRefs:\n  - name: web-gw\n  rules:\n  - matches:\n    - path: {type: PathPrefix, value: /web}\n    backendRefs:\n    - name: web-clusterip\n      port: 80\nEOF", e:"kubectl get httproute web-route แสดง status Accepted: True", tr:"ถ้า Accepted: False มักเป็นเพราะ parentRefs สะกดชื่อ Gateway ผิด หรือ backendRefs ชี้ Service ที่ไม่มีจริง"},
          {i:"หา external IP/port ของ Gateway แล้วยิง curl ทดสอบ path matching", c:"kubectl get svc cilium-gateway-web-gw\ncurl http://<EXTERNAL-IP>/web", e:"ได้หน้า nginx default กลับมา (HTML ที่ขึ้นต้นด้วย Welcome to nginx)", tr:"บน kind ที่ไม่มี LoadBalancer จริง ให้ port-forward แทน: kubectl port-forward svc/cilium-gateway-web-gw 8080:80 แล้ว curl localhost:8080/web"}
        ],
        challenge:{ task:"เขียน HTTPRoute เดิมให้รองรับ 2 backend (web-v1, web-v2) แบบ weighted 80/20 โดยไม่แก้ Gateway เลย — แสดงว่าทำไมสถาปัตยกรรมนี้ถึงแยก concern ได้ดีกว่า Ingress", reveal:"เพิ่ม backendRefs สองรายการใน rule เดียวกัน พร้อม field weight: 80 และ weight: 20 — Gateway ไม่ต้องแก้เลยเพราะ traffic-split เป็นเรื่องระดับ application (HTTPRoute) ล้วนๆ ทีม dev แก้ HTTPRoute ของตัวเองได้อิสระโดยไม่ต้องขอสิทธิ์แตะ Gateway ที่ทีม platform ดูแล ต่างจาก Ingress annotation ที่มักผูกกับสิทธิ์ระดับเดียวกันทั้งไฟล์"}
      }
    }
  ],
  quiz:[
    {q:"Headless Service (clusterIP: None) ต่างจาก ClusterIP ปกติอย่างไร?", options:["Headless เร็วกว่าเสมอ","DNS ของ Headless คืน IP ของทุก pod ตรงๆ แทนที่จะคืน VIP เดียว","Headless ใช้ได้เฉพาะกับ NodePort","ClusterIP ไม่มี DNS name"], correct:1, explain:"Headless Service ไม่มี VIP ให้ kube-proxy/eBPF ทำ DNAT ดังนั้น DNS query จะคืนค่า IP ของ pod ทุกตัวที่ label ตรงกันโดยตรง เหมาะกับ client ที่ต้องรู้จัก pod แต่ละตัว เช่น StatefulSet"},
    {q:"เหตุผลหลักที่ Kubernetes เปลี่ยนจาก Endpoints มาเป็น EndpointSlice คืออะไร?", options:["EndpointSlice รองรับ IPv6 เท่านั้น","ลด load ต่อ apiserver/etcd ตอน scale ใหญ่โดยแบ่งเป็นชิ้นย่อยแทนก้อนเดียว","EndpointSlice ทำ encryption อัตโนมัติ","Endpoints ใช้กับ Ingress ไม่ได้"], correct:1, explain:"EndpointSlice แบ่ง endpoint เป็นชิ้นย่อย (สูงสุด 100 ต่อ slice) ทำให้อัปเดตเฉพาะ slice ที่เปลี่ยนจริง ลด network/CPU overhead เมื่อ Service มี backend pod จำนวนมาก"},
    {q:"ทำไม IPVS mode ถึงมีประสิทธิภาพดีกว่า iptables mode เมื่อจำนวน Service เพิ่มขึ้นมาก?", options:["IPVS ใช้ hash table lookup แบบ O(1) แทน chain scan แบบ O(n)","IPVS ไม่ต้องใช้ kernel","IPVS ทำงานเฉพาะบน cloud เท่านั้น","iptables ไม่รองรับ TCP"], correct:0, explain:"iptables ประเมินกฎแบบ linear scan ตาม chain ทำให้ latency เพิ่มตามจำนวน Service เชิงเส้น ส่วน IPVS ใช้ kernel hash table ซึ่ง lookup คงที่ไม่ว่าจำนวน Service จะมากแค่ไหน"},
    {q:"ในคลัสเตอร์ที่เปิด kubeProxyReplacement=true บน Cilium สิ่งใดหายไปจากคลัสเตอร์?", options:["CoreDNS","kube-proxy DaemonSet","NetworkPolicy","Gateway API CRDs"], correct:1, explain:"เมื่อเปิด kube-proxy replacement Cilium ทำหน้าที่ load balancing ผ่าน eBPF map เองทั้งหมด ทำให้ไม่จำเป็นต้องรัน kube-proxy DaemonSet อีกต่อไป"},
    {q:"plugin ใดใน Corefile ของ CoreDNS ทำหน้าที่ตอบ query สำหรับ *.svc.cluster.local?", options:["forward","cache","kubernetes","loop"], correct:2, explain:"plugin kubernetes อ่านข้อมูล Service/EndpointSlice จาก apiserver โดยตรงเพื่อตอบ query ภายในโดเมน cluster.local"},
    {q:"query DNS ที่ไม่ตรงกับโดเมนภายในคลัสเตอร์ (เช่น google.com) จะถูกจัดการอย่างไรใน CoreDNS?", options:["ถูก drop ทันที","ถูก forward ไปยัง upstream DNS ผ่าน forward plugin","ถูก cache ตลอดไปโดยไม่ query จริง","CoreDNS ปฏิเสธ query ประเภทนี้เสมอ"], correct:1, explain:"forward plugin ส่ง query ที่ plugin kubernetes ตอบไม่ได้ต่อไปยัง upstream DNS server (มักอ่านจาก /etc/resolv.conf ของ node)"},
    {q:"ใน Gateway API ทรัพยากรใดที่ทีม application ทั่วไปควรเป็นเจ้าของ/แก้ไขเอง?", options:["GatewayClass","Gateway","HTTPRoute","ทั้งสามอย่างเท่ากัน"], correct:2, explain:"Gateway API ออกแบบให้ HTTPRoute เป็นระดับ application (path/header matching, traffic split) แยกจาก Gateway ซึ่งเป็นระดับ infrastructure (listener, TLS) ที่ทีม platform ดูแล"},
    {q:"ข้อได้เปรียบของ traffic splitting ใน Gateway API เทียบกับ Ingress คืออะไร?", options:["Gateway API ทำ traffic split ผ่าน field มาตรฐาน (weight ใน backendRefs) โดยไม่ต้องพึ่ง annotation เฉพาะ controller","Ingress ทำ traffic split ได้เร็วกว่าเสมอ","Gateway API ไม่รองรับ traffic split","ทั้งสองไม่ต่างกัน"], correct:0, explain:"Gateway API มี backendRefs พร้อม weight เป็น field มาตรฐานใน spec ทำให้ portable ข้าม implementation ต่าง Ingress ที่ต้องพึ่ง annotation เฉพาะของแต่ละ controller"},
    {q:"GatewayClass ใน Gateway API เทียบเคียงได้กับทรัพยากรใดใน Kubernetes?", options:["StorageClass","ConfigMap","NetworkPolicy","ServiceAccount"], correct:0, explain:"GatewayClass ทำหน้าที่คล้าย StorageClass คือระบุว่าจะใช้ controller ตัวไหนจัดการ Gateway ที่อ้างถึงคลาสนั้น เป็นแนวคิด class-based provisioning เดียวกัน"},
    {q:"ถ้า kubectl get httproute แสดง status Accepted: False สาเหตุที่พบบ่อยที่สุดคืออะไร?", options:["Gateway หรือ backend Service ที่ parentRefs/backendRefs อ้างถึงไม่มีอยู่จริงหรือสะกดผิด","CoreDNS ล่ม","Node ไม่มี label","Pod ใช้ CPU เกิน limit"], correct:0, explain:"HTTPRoute จะ Accepted: False เมื่อ controller ตรวจสอบแล้วพบว่า parentRefs (Gateway) หรือ backendRefs (Service) ที่อ้างถึงไม่ถูกต้องหรือไม่มีอยู่จริง"}
  ]
},
{
  id:"m3", short:"Traffic Mgmt", title:"Module 3 · Advanced Traffic Management", weight:20,
  blurb:"เมื่อ traffic ซับซ้อนกว่า request-response ธรรมดา: canary release, egress control, multi-cluster และ traffic routing สำหรับ AI/inference workload",
  topics:[
    { id:"m3-t1", title:"Canary Release ด้วย Weighted HTTPRoute", summary:"ทำ progressive rollout โดยไม่ต้องพึ่ง service mesh เต็มรูปแบบ",
      primer:{
        need:"\"canary release\" คืออะไร ทำไมไม่ deploy ทีเดียวให้จบ",
        body:`<p>ปัญหา: เวอร์ชันใหม่ที่ทดสอบผ่านหมดแล้ว ก็ยังพังได้ตอนเจอผู้ใช้จริง ถ้าสลับไปเวอร์ชันใหม่ทีเดียว 100% แล้วมันพัง = ผู้ใช้ทุกคนเจอพร้อมกัน</p>
        <p><strong>canary release</strong> คือการปล่อยเวอร์ชันใหม่ให้ผู้ใช้<strong>ส่วนน้อย</strong>ก่อน (เช่น 5-20%) แล้วเฝ้าดูว่ามีอะไรผิดปกติไหม ถ้าปกติดีค่อยเพิ่มสัดส่วนขึ้นเรื่อยๆ ถ้าเจอปัญหาก็ดึงกลับทันทีโดยกระทบคนแค่ส่วนน้อย</p>
        <p>ชื่อนี้มาจากธรรมเนียมเก่าของคนงานเหมืองที่เอานกคีรีบูน (canary) ลงไปด้วย ถ้านกเป็นอะไรก่อนแปลว่าอากาศมีพิษ ต้องรีบขึ้น</p>
        <ul>
          <li><strong>rollout</strong> — การทยอยเปลี่ยนไปเวอร์ชันใหม่</li>
          <li><strong>rollback</strong> — การถอยกลับไปเวอร์ชันเดิมเมื่อพบปัญหา ยิ่งทำได้เร็วยิ่งดี</li>
          <li>หัวใจของหัวข้อนี้คือ <strong>สัดส่วน traffic ควบคุมได้โดยไม่ต้องแตะตัวแอป</strong> — แค่ปรับตัวเลขที่ชั้น routing</li>
        </ul>`,
        try:[
          {i:"ดูว่าตอนนี้มี Deployment อะไรอยู่บ้าง และแต่ละตัวมีกี่ replica (จำนวน pod)", c:"kubectl get deploy", e:"เห็นคอลัมน์ READY บอกว่ามี pod พร้อมใช้งานกี่ตัวจากที่ขอไว้"},
          {i:"ลองสั่ง rollout แล้วดูประวัติ — k8s เก็บไว้ให้ถอยกลับได้", c:"kubectl rollout history deploy/web", e:"เห็นรายการ revision ที่ผ่านมา ซึ่งใช้สั่ง kubectl rollout undo เพื่อถอยกลับได้ (คนละกลไกกับการปรับสัดส่วน traffic ที่หัวข้อนี้จะสอน)"}
        ]
      },
      concept:`<p>Gateway API ทำ traffic splitting ระดับ weight ได้ในตัวผ่าน <code>backendRefs[].weight</code> — เพียงพอสำหรับ canary release พื้นฐานโดยไม่ต้องติดตั้ง service mesh เต็มรูปแบบ (sidecar) เลย</p>
      <ul>
        <li>Weight เป็นค่าสัมพัทธ์ (relative) ไม่ใช่ percentage ตรงตัว — ถ้าใส่ 80 กับ 20 ระบบคิดสัดส่วน 80:20 เหมือนกับใส่ 4 กับ 1</li>
        <li>ทุก request ที่ผ่าน rule เดียวกันจะสุ่มเลือก backend ตาม weight โดยประมาณ (ไม่ได้แม่นยำ 100% ต่อ request จำนวนน้อย)</li>
        <li>rollback ทำได้ทันทีแค่แก้ weight กลับเป็น 100/0 โดยไม่ต้อง redeploy</li>
      </ul>`,
      lab:{ title:"ปรับ HTTPRoute เดิมให้แบ่งน้ำหนักระหว่างสองเวอร์ชัน แล้ววัดผลจริง",
        prereqs:"ใช้ web-gw และ web-route จาก Module 2 Topic 4 เป็นฐาน",
        steps:[
          {i:"สร้าง Deployment/Service เวอร์ชันที่สองเพื่อเทียบกับของเดิม", c:"kubectl create deployment web-v2 --image=nginxdemos/hello --replicas=2\nkubectl expose deployment web-v2 --port=80 --name=web-v2-svc", e:"kubectl get pods -l app=web-v2 แสดง 2 pod สถานะ Running", tr:"ถ้า image pull ช้าบนเครื่อง local ให้รอสักครู่แล้วเช็คซ้ำ"},
          {i:"แก้ HTTPRoute เดิมให้มี backendRefs สองตัวพร้อม weight 80/20", c:"kubectl patch httproute web-route --type merge -p '{\"spec\":{\"rules\":[{\"matches\":[{\"path\":{\"type\":\"PathPrefix\",\"value\":\"/web\"}}],\"backendRefs\":[{\"name\":\"web-clusterip\",\"port\":80,\"weight\":80},{\"name\":\"web-v2-svc\",\"port\":80,\"weight\":20}]}]}}'", e:"kubectl get httproute web-route -o yaml แสดง backendRefs สองรายการพร้อม weight ตามที่ตั้ง", tr:"ถ้า patch fail เพราะ JSON path ไม่ตรง โครงสร้างเดิม ให้ kubectl edit httproute web-route แล้วแก้ด้วยมือแทน"},
          {i:"ยิง request ซ้ำหลายครั้งแล้วนับว่าตกที่ backend ไหนกี่ครั้ง", c:"for i in $(seq 1 20); do curl -s http://localhost:8080/web | grep -o -m1 'nginx\\|Hello' ; done | sort | uniq -c", e:"เห็นสัดส่วนประมาณ 16-17 ครั้งไปที่ nginx (v1) และ 3-4 ครั้งไปที่ Hello (v2) ใกล้เคียง 80/20", tr:"ถ้ายังใช้ port-forward เดิมค้างจาก Module 2 ให้เปิดใหม่ชี้ไปที่ Gateway svc ก่อนยิง curl"}
        ],
        challenge:{ task:"ทำ rollback แบบทันทีจาก 80/20 กลับเป็น 100% v1 โดยไม่ downtime แล้วอธิบายว่าทำไมวิธีนี้ปลอดภัยกว่าการ kubectl delete deployment web-v2 ตรงๆ", reveal:"แก้ weight เป็น {web-clusterip:100, web-v2-svc:0} (หรือเอา backendRef ของ v2 ออก) แล้ว apply — traffic หยุดไป v2 ทันทีโดย pod ของ v2 ยังรันอยู่เผื่อ roll-forward อีกครั้ง ต่างจากการ delete deployment ที่ทำลาย pod ทันที ถ้าจะ roll-forward ใหม่ต้องรอ image pull + startup ใหม่ทั้งหมด ซึ่งช้ากว่าการแค่ปรับ weight มาก"}
      }
    },
    { id:"m3-t2", title:"Egress Gateway", summary:"บังคับ traffic ขาออกจาก namespace ให้ผ่าน IP คงที่ตัวเดียว เพื่อให้ปลายทาง whitelist ได้",
      diagram:"egressGw",
      primer:{
        need:"ingress กับ egress ต่างกันยังไง แล้วทำไม \"source IP\" ถึงสำคัญ",
        body:`<p>สองคำนี้คือ<strong>ทิศทางของ traffic</strong> เมื่อมองจากมุมของระบบเรา</p>
        <ul>
          <li><strong>ingress</strong> = ขาเข้า — คนข้างนอกเรียกเข้ามาหาบริการเรา (Module 2 เรื่อง Gateway คือเรื่องนี้)</li>
          <li><strong>egress</strong> = ขาออก — บริการของเราเรียกออกไปหาข้างนอก เช่น ไปเรียก API ของธนาคาร หรือดึงข้อมูลจาก SaaS</li>
        </ul>
        <p><strong>source IP</strong> คือ "ที่อยู่ผู้ส่ง" บนซองจดหมาย ปลายทางใช้เลขนี้ตอบกลับ และ — ที่สำคัญกว่า — ใช้<strong>ตรวจว่าใครเป็นคนเรียกมา</strong></p>
        <p>ธนาคารหรือ payment gateway หลายเจ้าบังคับให้แจ้ง IP ล่วงหน้าแล้วเขาจะอนุญาตเฉพาะเลขนั้น (เรียกว่า <strong>whitelist</strong> หรือ allow-list) ซึ่งชนกับธรรมชาติของ k8s ตรงที่ pod เกิดใหม่ได้ IP ใหม่ตลอดเวลา และเวลาออกเน็ตมันจะติด IP ของ node ที่บังเอิญไปอยู่ ซึ่งเปลี่ยนไปเรื่อยๆ</p>
        <p>หัวข้อนี้คือวิธีบังคับให้ traffic ขาออกของ pod กลุ่มที่เรากำหนด ออกไปด้วย IP เดียวคงที่เสมอ (ทำโดย <strong>SNAT</strong> — แก้ที่อยู่ผู้ส่งระหว่างทาง)</p>`,
        try:[
          {i:"ดูว่าตอนนี้ pod ออกเน็ตด้วย source IP อะไร (ยังไม่ได้ตั้ง egress gateway)", c:"kubectl exec netcheck -- curl -s --max-time 5 ifconfig.me\nkubectl get pod netcheck -o jsonpath='{\"  pod IP คือ \"}{.status.podIP}{\"\\n\"}'", e:"IP ที่ปลายทางเห็น ไม่ใช่ IP ของ pod — แปลว่ามีการแก้ที่อยู่ผู้ส่ง (SNAT) ระหว่างทางแล้ว; บน kind เลขที่ได้จะเป็น IP สาธารณะของเครื่อง host เพราะถูก NAT ซ้ำอีกชั้นโดย Docker ไม่ใช่ IP ของ node (ถ้าเครื่องไม่มีเน็ตออก ข้ามข้อนี้ได้)"},
          {i:"เทียบกับ IP ของ pod และของ node เพื่อดูว่าตรงกับตัวไหน", c:"kubectl get pod netcheck -o jsonpath='pod IP: {.status.podIP}{\"\\n\"}node: {.spec.nodeName}{\"\\n\"}'", e:"IP ที่ปลายทางเห็น ไม่ใช่ pod IP — ยืนยันว่ามีการแก้ที่อยู่ผู้ส่ง (SNAT) เกิดขึ้นระหว่างทางอยู่แล้วโดยปริยาย"}
        ]
      },
      concept:`<p>ปัญหาที่พบบ่อย: บริการภายนอก (เช่น payment gateway) ต้องการ whitelist source IP แต่ pod ใน k8s มี IP เปลี่ยนตลอดเวลาตาม scheduling — <strong>Egress Gateway</strong> แก้ปัญหานี้โดยบังคับ traffic ขาออกจาก namespace/pod ที่กำหนด ให้วิ่งผ่าน node ที่ถูกเลือกเป็น gateway แล้ว SNAT ด้วย IP คงที่ตัวเดียวเสมอ</p>
      <ul>
        <li><strong>CiliumEgressGatewayPolicy</strong> — เลือก source (namespace/podSelector), destination CIDR, และ egress node/IP ที่จะใช้</li>
        <li>ต้องเปิด flag <code>egressGateway.enabled=true</code> ตอนติดตั้ง Cilium (ไม่ได้เปิด default)</li>
        <li>ต่างจาก NAT gateway ของ cloud provider ตรงที่นี่ควบคุมได้ระดับ pod/namespace ไม่ใช่ระดับ subnet ทั้งก้อน</li>
      </ul>`,
      lab:{ title:"เปิด Egress Gateway แล้วพิสูจน์ว่า source IP คงที่จริง",
        prereqs:"Egress Gateway ต้องการทั้ง egressGateway.enabled=true และ bpf.masquerade=true คู่กัน (และต้องมี kubeProxyReplacement ซึ่งเปิดไว้แล้วตั้งแต่ Module 0)",
        steps:[
          {i:"เปิด feature egress gateway บน Cilium — ต้องเปิด bpf.masquerade ด้วยเสมอ ไม่งั้น SNAT ของ egress gateway จะไม่ทำงาน", c:"helm upgrade cilium cilium/cilium --version 1.15.6 -n kube-system --reuse-values \\\n  --set egressGateway.enabled=true \\\n  --set bpf.masquerade=true\nkubectl -n kube-system rollout status ds/cilium", e:"DaemonSet cilium restart แล้วขึ้น Ready ครบทุก node", tr:"ถ้าลืม bpf.masquerade=true policy จะ apply ผ่านแต่ source IP ปลายทางจะไม่เปลี่ยนเป็น IP ของ gateway; ถ้า pod cilium ติด CrashLoopBackOff ตรวจว่า kernel ของ node รองรับ eBPF masquerade (บน kind ใช้ kernel ของ host จึงมักผ่าน)"},
          {i:"สร้าง label ให้ node หนึ่งตัวเป็น egress gateway", c:"kubectl label node ckne-worker2 egress-gateway=true", e:"node ckne-worker2 มี label egress-gateway=true เพิ่มขึ้นมา", tr:"ตรวจสอบด้วย kubectl get node --show-labels | grep egress-gateway"},
          {i:"สร้าง CiliumEgressGatewayPolicy ให้ namespace default ออกผ่าน node นั้นด้วย SNAT IP คงที่", c:"cat <<EOF | kubectl apply -f -\napiVersion: cilium.io/v2\nkind: CiliumEgressGatewayPolicy\nmetadata:\n  name: egress-sample\nspec:\n  selectors:\n  - podSelector:\n      matchLabels:\n        run: netcheck\n  destinationCIDRs:\n  - \"0.0.0.0/0\"\n  egressGateway:\n    nodeSelector:\n      matchLabels:\n        egress-gateway: \"true\"\nEOF", e:"kubectl get ciliumegressgatewaypolicy แสดง policy สร้างสำเร็จ", tr:"ถ้า apply ไม่ผ่าน ตรวจ apiVersion ให้ตรงกับ version ของ Cilium CRD ที่ติดตั้งจริง (kubectl get crd | grep egress)"},
          {i:"ตั้งปลายทางทดสอบไว้ในคลัสเตอร์ (อย่าใช้ ifconfig.me บน kind — ดูเหตุผลใน \"ถ้าไม่สำเร็จ\") แล้วดู source IP ที่ปลายทางเห็นจริง", c:"kubectl run listener --image=nicolaka/netshoot --overrides='{\"spec\":{\"hostNetwork\":true,\"nodeName\":\"ckne-control-plane\"}}' --command -- nc -lk -p 8080\nsleep 5\nkubectl exec netcheck -- sh -c 'echo hello | nc -w 3 $(kubectl get node ckne-control-plane -o jsonpath=\"{.status.addresses[0].address}\") 8080' 2>/dev/null || true\nkubectl logs listener --tail=5", e:"ฝั่ง listener เห็น connection มาจาก IP ของ node ckne-worker2 (ตัวที่ตั้งเป็น egress gateway) ไม่ใช่ IP ของ pod netcheck และไม่ใช่ node ที่ pod นั้นรันอยู่", tr:"เหตุผลที่ไม่ใช้ ifconfig.me: บน kind ทุก node เป็น container ที่มี IP ส่วนตัวของ Docker network แล้วถูก NAT อีกชั้นตอนออกอินเทอร์เน็ตจริง ปลายทางภายนอกจึงเห็นเป็น IP สาธารณะของเครื่อง host เสมอ ไม่ว่าจะออกทาง node ไหน — แล็บจะพิสูจน์อะไรไม่ได้เลย ต้องวางปลายทางไว้ในเครือข่ายเดียวกันถึงจะเห็น source IP จริง"}
        ],
        challenge:{ task:"ถ้ามี pod สองตัวใน namespace เดียวกัน ตัวหนึ่งตรงกับ podSelector ของ policy อีกตัวไม่ตรง จะเกิดอะไรขึ้นกับ traffic ขาออกของแต่ละตัว", reveal:"เฉพาะ pod ที่ label ตรงกับ podSelector ของ CiliumEgressGatewayPolicy เท่านั้นที่ traffic ขาออกจะถูกบังคับผ่าน egress gateway node และ SNAT ด้วย IP คงที่ ส่วน pod ที่ label ไม่ตรงจะออกผ่านเส้นทางปกติ (SNAT ด้วย IP ของ node ตัวเองตามปกติ) — เพราะ policy นี้ scope แคบระดับ pod ไม่ใช่ทั้ง namespace เว้นแต่จะเขียน podSelector ให้ครอบคลุมทุก pod"}
      }
    },
    { id:"m3-t3", title:"Cross-Cluster Service Discovery (ClusterMesh)", summary:"ให้ Service ของสองคลัสเตอร์มองเห็นและเรียกกันได้เหมือนอยู่คลัสเตอร์เดียวกัน",
      primer:{
        need:"ทำไมเรียก service ข้ามคลัสเตอร์ถึงยาก ในเมื่อในคลัสเตอร์เดียวกันเรียกกันง่ายมาก",
        body:`<p>ในคลัสเตอร์เดียวกัน pod เรียกกันด้วยชื่อสั้นได้เลย เพราะทุกอย่างใช้ของกลางชุดเดียวกัน — DNS ตัวเดียวกัน, ช่วง IP ที่จัดสรรมาไม่ให้ชนกัน, และตัวควบคุมกลาง (API server) ตัวเดียวกันที่รู้ว่ามี pod อะไรอยู่ที่ไหนบ้าง</p>
        <p>พอเป็นคนละคลัสเตอร์ ของกลางพวกนั้น<strong>แยกกันคนละชุดโดยสิ้นเชิง</strong> คลัสเตอร์ A ไม่รู้จักด้วยซ้ำว่าคลัสเตอร์ B มีตัวตน จึงเกิดปัญหา 3 ข้อพร้อมกัน</p>
        <ul>
          <li><strong>DNS ไม่รู้จักกัน</strong> — ถาม CoreDNS ของ A ว่า service ใน B อยู่ IP ไหน มันตอบไม่ได้</li>
          <li><strong>IP อาจซ้ำกัน</strong> — ทั้งสองคลัสเตอร์อาจแจก 10.244.x.x เหมือนกัน พอส่งของไปเลขนั้น ระบบไม่รู้ว่าหมายถึงเครื่องในคลัสเตอร์ไหน</li>
          <li><strong>ไม่มีเส้นทางถึงกัน</strong> — IP ของ pod ใช้ได้เฉพาะภายในคลัสเตอร์ตัวเอง</li>
        </ul>
        <p>วิธีเดิมคือเปิด Service ออกสู่ภายนอกผ่าน LoadBalancer แล้วให้อีกฝั่งเรียกผ่าน IP สาธารณะ ซึ่งช้าและต้องจัดการความปลอดภัยเพิ่ม — หัวข้อนี้เป็นวิธีที่ทำให้ทั้งสองคลัสเตอร์<strong>มองเห็น service ของกันและกันเหมือนอยู่ที่เดียวกัน</strong></p>`,
        try:[
          {i:"ดูว่า kubectl ตอนนี้รู้จักคลัสเตอร์ไหนบ้าง (context = คลัสเตอร์ที่ตั้งค่าไว้หนึ่งชุด)", c:"kubectl config get-contexts", e:"มีเครื่องหมาย * หน้าอันที่ใช้อยู่ ถ้ายังมีแค่อันเดียวก็ถูกแล้ว แล็บข้างล่างจะสร้างคลัสเตอร์ที่สองเพิ่ม"},
          {i:"ดูช่วง IP ที่คลัสเตอร์นี้ใช้ — จำเลขนี้ไว้ เพราะคลัสเตอร์ที่สองต้องใช้ช่วงที่ไม่ทับกัน", c:"kubectl get ciliumnodes -o jsonpath='{range .items[*]}{.spec.ipam.podCIDRs}{\" \"}{end}{\"\\n\"}'", e:"ได้ช่วงที่ขึ้นต้นด้วย 10.244 — แล็บข้างล่างจะตั้งคลัสเตอร์ที่สองเป็น 10.245 เพื่อไม่ให้ชนกัน"}
        ]
      },
      concept:`<p><strong>ClusterMesh</strong> (ฟีเจอร์ของ Cilium) เชื่อมหลายคลัสเตอร์เข้าด้วยกันในระดับ network ทำให้ pod ของคลัสเตอร์ A เรียก Service ของคลัสเตอร์ B ได้ตรงๆ ผ่าน DNS โดยไม่ต้องผ่าน external LB หรือ VPN gateway แยกต่างหาก</p>
      <ul>
        <li>แต่ละคลัสเตอร์ต้องมี <strong>unique cluster name</strong> และ <strong>unique cluster ID</strong> (1-255) ห้ามชนกัน</li>
        <li>Service ที่ต้องการแชร์ข้ามคลัสเตอร์ต้อง annotate ด้วย <code>service.cilium.io/global: "true"</code></li>
        <li>DNS จะ resolve ชื่อ global service ให้คืน IP จากทุกคลัสเตอร์ที่มี backend Ready รวมกัน — โหลดบาลานซ์ข้ามคลัสเตอร์ได้เลย</li>
        <li>Pod CIDR ของแต่ละคลัสเตอร์ <strong>ห้ามทับกัน</strong> ไม่งั้น routing จะสับสน — ต้อง plan ตั้งแต่ตอนสร้างคลัสเตอร์</li>
      </ul>`,
      lab:{ title:"จำลอง ClusterMesh ด้วย kind สองคลัสเตอร์ (แล็บขั้นสูง — ใช้เวลานานกว่าแล็บอื่น)",
        prereqs:"ต้องมี Cilium CLI เวอร์ชันที่รองรับ clustermesh subcommand และเครื่องมี RAM เหลือพอสำหรับ cluster ที่สอง",
        steps:[
          {i:"สร้างคลัสเตอร์ที่สองด้วย pod CIDR ที่ไม่ทับกับคลัสเตอร์แรก แล้วติดตั้ง Cilium พร้อมตั้งชื่อ/ID ให้ชัดเจน", c:"cat <<EOF > kind-config2.yaml\nkind: Cluster\napiVersion: kind.x-k8s.io/v1alpha4\nnetworking:\n  disableDefaultCNI: true\n  kubeProxyMode: \"none\"\n  podSubnet: \"10.245.0.0/16\"\nnodes:\n  - role: control-plane\n  - role: worker\nEOF\nkind create cluster --config kind-config2.yaml --name ckne2\nhelm install cilium cilium/cilium --version 1.15.6 --namespace kube-system \\\n  --kube-context kind-ckne2 \\\n  --set cluster.name=ckne2 --set cluster.id=2 \\\n  --set kubeProxyReplacement=true \\\n  --set k8sServiceHost=ckne2-control-plane \\\n  --set k8sServicePort=6443 \\\n  --set ipam.operator.clusterPoolIPv4PodCIDRList='{10.245.0.0/16}'", e:"คลัสเตอร์ ckne2 พร้อมและ Cilium ขึ้น Running (cilium status --context kind-ckne2)", tr:"ถ้า RAM เครื่องไม่พอ ให้ลดจำนวน worker ของคลัสเตอร์แรกลงชั่วคราว"},
          {i:"เปิด ClusterMesh บนทั้งสองฝั่ง (ชื่อ/ID ของคลัสเตอร์แรกตั้งไว้แล้วตั้งแต่ Module 0 จึงไม่ต้องแก้คลัสเตอร์ที่รันอยู่)", c:"cilium clustermesh status --context kind-ckne | head -3\ncilium clustermesh enable --context kind-ckne --service-type NodePort\ncilium clustermesh enable --context kind-ckne2 --service-type NodePort", e:"ทั้งสองคำสั่งรันจนจบไม่มี error และสร้าง Service สำหรับ clustermesh-apiserver ขึ้นมา", tr:"ใช้ --service-type NodePort เพราะ kind ไม่มี LoadBalancer จริง ถ้าไม่ระบุ Service จะค้าง pending ตลอด; ถ้า cilium บอกว่า cluster.id ยังเป็น 0 แปลว่าติดตั้ง Module 0 ไว้ก่อนที่คอร์สจะเพิ่ม flag นี้ — การเปลี่ยน cluster.id บนคลัสเตอร์ที่รันอยู่กระทบทุก pod (identity/IP ถูกจัดใหม่) ทางที่สะอาดกว่าคือ kind delete cluster --name ckne แล้วทำ Module 0 ใหม่"},
          {i:"เชื่อมสองคลัสเตอร์เข้าด้วยกันแล้วตรวจสถานะ", c:"cilium clustermesh connect --context kind-ckne --destination-context kind-ckne2\ncilium clustermesh status --context kind-ckne --wait", e:"เห็น \"✅ Cluster connections: ckne2\" และ endpoint ที่ sync ข้ามคลัสเตอร์มากกว่า 0", tr:"ถ้าเชื่อมไม่สำเร็จ มักเป็นปัญหา network ระหว่าง Docker network ของสองคลัสเตอร์ — ตรวจว่าทั้งคู่อยู่ docker network เดียวกันด้วย docker network inspect kind"},
          {i:"ประกาศ Service ในคลัสเตอร์ 2 เป็น global แล้วเรียกจาก pod ในคลัสเตอร์ 1", c:"kubectl --context kind-ckne2 annotate service web-clusterip service.cilium.io/global=\"true\"\nkubectl --context kind-ckne annotate service web-clusterip service.cilium.io/global=\"true\"\nkubectl --context kind-ckne exec netcheck -- curl -s web-clusterip.default.svc.cluster.local", e:"ได้ response กลับมาแม้ pod backend อาจอยู่คนละคลัสเตอร์กับ client", tr:"ถ้า resolve ไม่เจอ ตรวจว่า Service ชื่อเดียวกันมีอยู่ทั้งสอง namespace/คลัสเตอร์จริง และ annotate ครบทั้งสองฝั่ง"}
        ],
        challenge:{ task:"อธิบายว่าทำไม pod CIDR ของสองคลัสเตอร์ต้องไม่ทับกันใน ClusterMesh ทั้งที่แต่ละคลัสเตอร์มี etcd/apiserver แยกกันเป็นอิสระ", reveal:"ClusterMesh route traffic ข้ามคลัสเตอร์โดยตรงระดับ pod IP (ไม่ผ่าน NAT) ผ่าน tunnel ระหว่าง node ของสองคลัสเตอร์ ถ้า pod CIDR ทับกัน routing table จะไม่รู้ว่า IP ปลายทางอยู่คลัสเตอร์ไหนกันแน่ ทำให้ traffic หลงทางหรือชนกัน จึงต้อง plan CIDR ให้ไม่ overlap ตั้งแต่ต้นเหมือนการเชื่อม VPC สองใบเข้าด้วยกัน"}
      }
    },
    { id:"m3-t4", title:"Service Mesh Basics และ AI/LLM Traffic Routing", summary:"sidecar vs sidecar-less mesh และการ route traffic ไปยัง inference backend หลายตัว",
      primer:{
        need:"proxy / sidecar / mTLS สามคำนี้แปลว่าอะไร",
        body:`<p><strong>proxy</strong> คือคนกลางที่รับ traffic แทนแล้วส่งต่อให้ — ข้อดีคือมันแทรกตัวอยู่ตรงกลางได้ จึงทำอะไรเพิ่มระหว่างทางได้ทุกอย่าง (นับสถิติ, เข้ารหัส, ลองใหม่เมื่อพลาด, บล็อก) โดยที่ตัวแอปไม่ต้องเขียนโค้ดอะไรเลย</p>
        <p><strong>sidecar</strong> คือรูปแบบการวาง proxy แบบหนึ่ง: ยัด container พิเศษเข้าไปอยู่<strong>ใน pod เดียวกัน</strong>กับแอป แล้วบังคับให้ traffic ของแอปวิ่งผ่านมันก่อนเสมอ ชื่อมาจากรถพ่วงข้างมอเตอร์ไซค์ — ไปไหนไปด้วยกัน</p>
        <p><strong>service mesh</strong> คือการทำแบบนั้นทั้งระบบ แล้วมีตัวควบคุมกลางคอยสั่งการ proxy ทุกตัวพร้อมกัน ทำให้กำหนดกฎทีเดียวมีผลทั้งคลัสเตอร์</p>
        <p><strong>mTLS (mutual TLS)</strong> — TLS ปกติ (เช่นเว็บ HTTPS) <strong>ฝั่งเดียว</strong>ที่ต้องพิสูจน์ตัวตนคือเซิร์ฟเวอร์ ส่วนเราในฐานะผู้ใช้ไม่ต้องพิสูจน์อะไร แต่ <strong>mutual</strong> แปลว่า <strong>ทั้งสองฝั่ง</strong>ต้องยื่นบัตรให้ตรวจ — ผลคือ service ปลายทางมั่นใจได้ว่าคนเรียกคือ service ที่อ้างจริง ไม่ใช่ใครก็ได้ที่บังเอิญส่งถึง</p>`,
        try:[
          {i:"ดูว่า pod หนึ่งตัวมีกี่ container — ถ้ามี mesh แบบ sidecar ตัวเลขนี้จะมากกว่า 1", c:"kubectl get pods -o custom-columns='POD:.metadata.name,CONTAINERS:.spec.containers[*].name' | head -6", e:"ตอนนี้ส่วนใหญ่มี container เดียว เพราะคอร์สนี้ใช้ Cilium ซึ่งเป็นแบบ sidecar-less (ใช้ eBPF ที่ระดับ kernel แทนการยัด proxy เข้าทุก pod)"},
          {i:"ดูว่า Cilium ทำหน้าที่ proxy ระดับ L7 ให้จากส่วนกลาง โดยไม่ต้องแตะ pod ของแอปเลย", c:"kubectl -n kube-system get pods -l k8s-app=cilium -o custom-columns='POD:.metadata.name,CONTAINERS:.spec.containers[*].name'", e:"proxy ทั้งหมดรวมอยู่ที่ agent ของ Cilium ระดับ node — นี่คือความต่างของ sidecar-less เทียบกับ mesh แบบดั้งเดิม"}
        ]
      },
      concept:`<p>Service mesh เพิ่มชั้น traffic management/observability/mTLS เหนือ Service ปกติ มี 2 สถาปัตยกรรมหลัก</p>
      <ul>
        <li><strong>Sidecar mesh</strong> (เช่น Istio แบบดั้งเดิม) — ฉีด proxy container (Envoy) เข้าทุก pod ควบคุม traffic ได้ละเอียดมากแต่เพิ่ม resource overhead ต่อ pod</li>
        <li><strong>Sidecar-less / ambient mesh</strong> (Cilium mesh, Istio Ambient) — ใช้ eBPF หรือ per-node proxy แทนการฉีด sidecar ทุก pod ลด overhead แต่บาง feature ละเอียดน้อยกว่า sidecar</li>
        <li><strong>mTLS</strong> — mesh ส่วนใหญ่เข้ารหัส + พิสูจน์ตัวตน traffic ระหว่าง pod อัตโนมัติโดย workload ไม่ต้องรู้ตัว</li>
        <li><strong>AI/LLM inference routing</strong> — เทรนด์ใหม่ใน CKNE blueprint: route request ไปยัง model backend ที่เหมาะสม (ตาม path, header เช่น model version, หรือ load ปัจจุบันของ GPU) ใช้หลักการเดียวกับ HTTPRoute path/header matching แต่ backend เป็น inference server แทน web service ธรรมดา</li>
      </ul>`,
      lab:{ title:"จำลอง inference routing ด้วย HTTPRoute แบบ header-based matching",
        prereqs:"ใช้ Gateway web-gw เดิมจาก Module 2",
        steps:[
          {i:"สร้าง Service สองตัวจำลอง model backend คนละเวอร์ชัน (ใช้ web ธรรมดาแทน inference server จริงเพื่อความง่ายของแล็บ)", c:"kubectl create deployment model-small --image=nginxdemos/hello --replicas=1\nkubectl create deployment model-large --image=nginx --replicas=1\nkubectl expose deployment model-small --port=80\nkubectl expose deployment model-large --port=80", e:"ได้ Service model-small และ model-large พร้อม pod Running", tr:"ถ้า pod ค้าง Pending ตรวจ resource ของ node ว่าพอสำหรับ pod เพิ่มหรือไม่"},
          {i:"สร้าง HTTPRoute ที่ route ตาม header x-model-tier ไปยัง backend ต่างกัน", c:"cat <<EOF | kubectl apply -f -\napiVersion: gateway.networking.k8s.io/v1\nkind: HTTPRoute\nmetadata:\n  name: model-route\nspec:\n  parentRefs:\n  - name: web-gw\n  rules:\n  - matches:\n    - path: {type: PathPrefix, value: /infer}\n      headers:\n      - name: x-model-tier\n        value: large\n    backendRefs:\n    - name: model-large\n      port: 80\n  - matches:\n    - path: {type: PathPrefix, value: /infer}\n    backendRefs:\n    - name: model-small\n      port: 80\nEOF", e:"kubectl get httproute model-route แสดง Accepted: True และมี 2 rules", tr:"Gateway API รุ่นเก่าบาง controller ยังไม่รองรับ header matching เต็มรูปแบบ ตรวจ Cilium version ให้เป็น 1.15+ ก่อน"},

  topics:[
    { id:"m4-t1", title:"NetworkPolicy พื้นฐาน: Default-Deny และ Selectors", summary:"กติกาพื้นฐานที่สุดของ network security ใน k8s",
      diagram:"netpolDeny",
      primer:{
        need:"firewall ทำงานยังไง แล้ว allow-list ต่างจาก deny-list ตรงไหน",
        body:`<p><strong>firewall</strong> คือด่านตรวจที่ดูข้อมูลแต่ละก้อนที่วิ่งผ่าน แล้วตัดสินว่า <strong>ให้ผ่าน</strong> หรือ <strong>ทิ้ง</strong> โดยเทียบกับรายการกฎที่เราเขียนไว้ ปกติดูจาก: ใครส่ง (source), ส่งถึงใคร (destination), port อะไร, โปรโตคอลอะไร</p>
        <p>สองแนวคิดที่ต้องแยกให้ขาด</p>
        <ul>
          <li><strong>deny-list</strong> (บัญชีดำ) — เปิดหมดก่อน แล้วค่อยไล่ปิดตัวที่รู้ว่าอันตราย ปัญหาคือ<strong>สิ่งที่เรายังไม่รู้ว่าอันตรายจะผ่านได้เสมอ</strong></li>
          <li><strong>allow-list</strong> (บัญชีขาว) — <strong>ปิดหมดก่อน</strong> แล้วเปิดเฉพาะที่จำเป็นจริงๆ ปลอดภัยกว่ามาก เพราะของที่ไม่ได้รับอนุญาตไว้ล่วงหน้าจะถูกบล็อกโดยอัตโนมัติ</li>
        </ul>
        <p>NetworkPolicy ของ k8s ทำงานแบบ <strong>allow-list</strong> ล้วน — เขียนได้แต่กฎ "อนุญาต" ไม่มีกฎ "ห้าม" เพราะพอมี policy ตัวแรกมาจับ pod ไหน ทุกอย่างที่ไม่ได้อนุญาตไว้จะถูกห้ามเองโดยปริยาย (เรียกว่า <strong>default-deny</strong>)</p>
        <p>อีกคำที่ต้องรู้: <strong>stateful</strong> แปลว่าระบบจำได้ว่า "การเชื่อมต่อนี้เราเป็นคนเริ่มเอง" ดังนั้น<strong>ขาตอบกลับจะผ่านได้เสมอ</strong>โดยไม่ต้องเขียนกฎเปิดขากลับเพิ่ม — เป็นจุดที่คนเขียน policy ใหม่ๆ สับสนบ่อยที่สุด</p>`,
        try:[
          {i:"ดูว่าตอนนี้ยังไม่มี policy อะไรเลย ทุก pod จึงคุยกันได้หมด (ค่าเริ่มต้นของ k8s คือเปิดหมด)", c:"kubectl get networkpolicy -A", e:"ได้ \"No resources found\" — ยืนยันว่ายังไม่มีด่านตรวจใดๆ อยู่เลย"},
          {i:"พิสูจน์ว่าเปิดหมดจริง โดยให้ pod ที่ไม่เกี่ยวข้องกันเลยคุยกันดู", c:"kubectl exec dns-test -- wget -qO- --timeout=3 http://web-clusterip | grep -o '<title>.*</title>'", e:"ได้หน้าเว็บกลับมา ทั้งที่ไม่มีใครอนุญาตไว้ — นี่คือสถานะเริ่มต้นที่หัวข้อนี้จะสอนให้ปิด"}
        ]
      },
      concept:`<p>โดยปริยาย k8s อนุญาตให้ทุก pod คุยกับทุก pod ได้หมด (flat network) — <strong>NetworkPolicy</strong> เป็นทรัพยากรที่เปลี่ยนพฤติกรรมนี้ แต่มีกติกาสำคัญที่ต้องจำให้แม่น</p>
      <ul>
        <li>ทันทีที่มี NetworkPolicy อย่างน้อยหนึ่งตัวเลือก pod ใด (ผ่าน podSelector) namespace/pod นั้นเข้าสู่โหมด <strong>default-deny</strong> สำหรับทิศทางที่ policy นั้นระบุ (ingress และ/หรือ egress)</li>
        <li>Policy หลายตัวที่เลือก pod เดียวกันจะถูก <strong>รวมกันแบบ OR</strong> (union) ไม่ใช่ AND — traffic ผ่านได้ถ้ามี rule ใดอนุญาต ไม่จำเป็นต้องผ่านทุก policy</li>
        <li><strong>podSelector</strong> เลือก pod ปลายทาง, <strong>namespaceSelector</strong> เลือก traffic จาก namespace อื่น, ใช้ร่วมกันได้เพื่อความละเอียด</li>
        <li>ถ้าไม่มี NetworkPolicy เลือก pod ตัวใดเลย pod นั้นยัง allow-all ตามปกติ (deny-by-default เกิดเฉพาะเมื่อ "ถูกเลือก" เท่านั้น)</li>
      </ul>`,
      lab:{ title:"ล็อกดาวน์ namespace แบบ default-deny แล้วเปิดเฉพาะที่จำเป็น",
        steps:[
          {i:"สร้าง namespace ทดสอบพร้อม pod frontend/backend", c:"kubectl create ns secdemo\nkubectl -n secdemo run frontend --image=nicolaka/netshoot --labels=role=frontend --command -- sleep 3600\nkubectl -n secdemo create deployment backend --image=nginx\nkubectl -n secdemo expose deployment backend --port=80", e:"pod frontend และ backend ขึ้น Running ใน namespace secdemo", tr:"ถ้า pod ค้าง Pending ตรวจว่า resource เหลือพอสำหรับ namespace ใหม่"},
          {i:"ยืนยันว่าก่อนมี policy ใดๆ frontend เรียก backend ได้ปกติ (allow-all โดย default)", c:"kubectl -n secdemo exec frontend -- curl -s -o /dev/null -w '%{http_code}\\n' backend", e:"ได้ 200 กลับมา", tr:"ถ้าได้ error connection refused ตรวจว่า Service backend สร้างสำเร็จและ label ตรงกับ Deployment"},
          {i:"ใส่ default-deny ingress ทั้ง namespace", c:"cat <<EOF | kubectl apply -f -\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: default-deny-ingress\n  namespace: secdemo\nspec:\n  podSelector: {}\n  policyTypes: [\"Ingress\"]\nEOF\nkubectl -n secdemo exec frontend -- curl -s -o /dev/null -w '%{http_code}\\n' backend --max-time 3", e:"curl ครั้งนี้ timeout หรือ error เพราะทุก pod ถูกเลือกโดย podSelector: {} และไม่มี rule อนุญาตเลย", tr:"ถ้ายังเชื่อมได้ ตรวจว่า policyTypes ระบุ Ingress ถูกต้อง และ CNI ที่ใช้รองรับ NetworkPolicy (Cilium รองรับเต็มรูปแบบ)"},
          {i:"เพิ่ม rule อนุญาตเฉพาะ frontend เรียก backend ได้ (ที่เหลือยังถูกบล็อก)", c:"cat <<EOF | kubectl apply -f -\napiVersion: networking.k8s.io/v1\nkind: NetworkPolicy\nmetadata:\n  name: allow-frontend-to-backend\n  namespace: secdemo\nspec:\n  podSelector:\n    matchLabels: {app: backend}\n  policyTypes: [\"Ingress\"]\n  ingress:\n  - from:\n    - podSelector:\n        matchLabels: {role: frontend}\nEOF\nkubectl -n secdemo exec frontend -- curl -s -o /dev/null -w '%{http_code}\\n' backend", e:"ได้ 200 กลับมาอีกครั้ง เพราะ frontend ตรงกับ rule ที่อนุญาตแล้ว", tr:"ถ้ายัง fail ตรวจ label บน pod backend จริงด้วย kubectl -n secdemo get pods --show-labels ว่าตรงกับ podSelector ของ NetworkPolicy"}
        ],
        challenge:{ task:"สร้าง pod ที่สามชื่อ intruder ใน namespace เดียวกันไม่มี label role=frontend แล้วพิสูจน์ว่ามันเรียก backend ไม่ได้ทั้งที่อยู่ namespace เดียวกัน", reveal:"kubectl -n secdemo run intruder --image=nicolaka/netshoot --command -- sleep 3600 แล้ว exec curl backend จาก pod นี้จะ timeout ทันที เพราะ NetworkPolicy พิจารณาจาก label ไม่ใช่ namespace เพียงอย่างเดียว — พิสูจน์หลักการสำคัญว่า 'อยู่ namespace เดียวกัน' ไม่ได้แปลว่า 'คุยกันได้' เมื่อมี default-deny ทำงานอยู่"}
      }
