    { id:"m4-t2", title:"CNI-specific Policy Extensions: L7 และ DNS-aware", summary:"NetworkPolicy มาตรฐานทำได้แค่ L3/L4 — ถ้าต้องการ L7 ต้องพึ่ง CRD เฉพาะ CNI",
      primer:{
        need:"L3 / L4 / L7 ที่พูดถึงกันบ่อยๆ คือชั้นอะไร",
        body:`<p>การส่งข้อมูลผ่านเครือข่ายถูกแบ่งเป็นชั้นๆ แต่ละชั้นรับผิดชอบคนละเรื่อง และ<strong>เห็นข้อมูลได้ไม่เท่ากัน</strong> — สามชั้นที่ต้องรู้จักสำหรับงาน k8s networking</p>
        <ul>
          <li><strong>L3 (Network)</strong> — ระดับ <strong>IP</strong> ตอบได้แค่ "ก้อนนี้จากเครื่องไหนไปเครื่องไหน"</li>
          <li><strong>L4 (Transport)</strong> — ระดับ <strong>port และ TCP/UDP</strong> เพิ่มความสามารถระบุว่า "คุยกับโปรแกรมตัวไหนบนเครื่องนั้น"</li>
          <li><strong>L7 (Application)</strong> — ระดับ<strong>เนื้อหาจริง</strong> เช่น HTTP method (GET/POST), path (<code>/admin</code>), header, หรือชื่อโดเมนที่ขอ</li>
        </ul>
        <p>ทำไมถึงสำคัญกับหัวข้อนี้: NetworkPolicy มาตรฐานเห็นได้แค่ <strong>L3/L4</strong> จึงเขียนได้แค่ "pod นี้คุยกับ pod นั้นที่ port 80 ได้" — แต่<strong>แยกไม่ออก</strong>ว่าที่ port 80 นั้นเขากำลังสั่ง <code>GET /health</code> (อ่านอย่างเดียว ปลอดภัย) หรือ <code>DELETE /admin/users</code> (ลบข้อมูล อันตราย) เพราะทั้งคู่หน้าตาเหมือนกันหมดเมื่อมองที่ L4</p>
        <p>การจะแยกสองอย่างนั้นออกต้องมีคนแกะอ่านเนื้อในถึง L7 ซึ่งเป็นสิ่งที่ CRD เฉพาะของแต่ละ CNI เพิ่มเข้ามา — แลกมาด้วย latency ที่สูงขึ้นเล็กน้อย เพราะต้องมีตัวกลางแกะอ่านก่อนตัดสินใจ</p>`,
        try:[
          {i:"ดูข้อมูลระดับ L3/L4 ของการเชื่อมต่อ — เห็นแค่ IP กับ port เท่านั้น", c:"kubectl exec -n secdemo frontend -- sh -c 'nc -zv backend 80 2>&1'", e:"บอกได้แค่ว่า port 80 ของ backend เปิดอยู่หรือไม่ — ข้อมูลระดับนี้คือทั้งหมดที่ NetworkPolicy มาตรฐานมองเห็น"},
          {i:"เทียบกับข้อมูลระดับ L7 — วิธีการ (method) และ path ที่ L4 มองไม่เห็นเลย", c:"kubectl exec -n secdemo frontend -- curl -s -o /dev/null -w 'GET  /      → %{http_code}\\n' http://backend/\nkubectl exec -n secdemo frontend -- curl -s -o /dev/null -w 'GET  /admin → %{http_code}\\n' http://backend/admin", e:"สอง request นี้ไปที่ IP และ port เดียวกันเป๊ะ ต่างกันแค่ path — ถ้าอยากอนุญาตอันแรกแต่บล็อกอันที่สอง ต้องใช้ policy ระดับ L7 เท่านั้น"}
        ]
      },
      concept:`<p>NetworkPolicy มาตรฐานของ k8s ทำงานที่ L3/L4 เท่านั้น (IP, port, protocol) — ถ้าต้องการควบคุมระดับ L7 (HTTP method, path) หรือจำกัด egress ตามชื่อโดเมน ต้องใช้ CRD เฉพาะของแต่ละ CNI</p>
      <ul>
        <li><strong>CiliumNetworkPolicy</strong> — เพิ่ม field <code>toPorts[].rules.http</code> ให้ระบุ method/path ที่อนุญาตได้ เช่น อนุญาตเฉพาะ GET /health แต่บล็อก DELETE /admin</li>
        <li><strong>toFQDNs</strong> — Cilium เฉพาะ อนุญาต egress ตามชื่อโดเมน (เช่น เฉพาะ api.stripe.com) โดยไม่ต้องรู้ IP ล่วงหน้า ระบบ resolve DNS แล้วอัปเดต allow-list อัตโนมัติ</li>
        <li><strong>Calico GlobalNetworkPolicy</strong> — คล้าย NetworkPolicy แต่ scope ครอบคลุมทั้งคลัสเตอร์ ไม่ผูกกับ namespace เดียว เหมาะกับ policy ระดับองค์กร (เช่น "ห้าม namespace ไหนคุยกับ metadata service ของ cloud")</li>
        <li>ข้อสำคัญ: policy พวกนี้ <strong>portable ข้าม CNI ไม่ได้</strong> — ย้าย CNI ต้องเขียน policy ใหม่ทั้งหมด</li>
      </ul>`,
      lab:{ title:"เขียน L7 policy จำกัด HTTP method และ DNS-aware egress policy",
        prereqs:"ใช้ pod frontend/backend จาก topic ก่อนหน้าใน namespace secdemo",
        steps:[
          {i:"ลบ NetworkPolicy มาตรฐานตัวเดิมออกก่อน แล้วเขียน CiliumNetworkPolicy ที่อนุญาตเฉพาะ HTTP GET ไปยัง backend", c:"kubectl -n secdemo delete networkpolicy allow-frontend-to-backend default-deny-ingress\ncat <<EOF | kubectl apply -f -\napiVersion: cilium.io/v2\nkind: CiliumNetworkPolicy\nmetadata:\n  name: l7-allow-get\n  namespace: secdemo\nspec:\n  endpointSelector:\n    matchLabels: {app: backend}\n  ingress:\n  - fromEndpoints:\n    - matchLabels: {role: frontend}\n    toPorts:\n    - ports: [{port: \"80\", protocol: TCP}]\n      rules:\n        http:\n        - method: \"GET\"\nEOF", e:"kubectl -n secdemo get ciliumnetworkpolicy แสดง policy สร้างสำเร็จ", tr:"ถ้า apply ไม่ผ่านตรวจว่า apiVersion cilium.io/v2 ตรงกับ CRD ที่ Cilium version นี้ติดตั้งจริง"},
          {i:"ทดสอบว่า GET ผ่านได้ แต่ POST ถูกบล็อกที่ระดับ L7", c:"kubectl -n secdemo exec frontend -- curl -s -o /dev/null -w 'GET: %{http_code}\\n' backend\nkubectl -n secdemo exec frontend -- curl -s -o /dev/null -w 'POST: %{http_code}\\n' -X POST backend --max-time 3", e:"GET ได้ 200 ส่วน POST ถูกบล็อกที่ระดับ connection (timeout หรือ 403 ขึ้นกับ mode) แม้เป็น TCP port เดียวกัน", tr:"L7 policy ต้องพึ่ง Envoy proxy ภายในของ Cilium ถ้าเพิ่งเปิด feature อาจต้องรอ proxy container ขึ้นก่อน ตรวจ kubectl -n kube-system get pods | grep cilium"},
          {i:"เขียน DNS-aware egress policy อนุญาตเฉพาะ pod frontend เรียกออกไปยัง one.one.one.one เท่านั้น — สังเกต rules.dns ใต้ port 53 ซึ่งจำเป็นเสมอ", c:"cat <<EOF | kubectl apply -f -\napiVersion: cilium.io/v2\nkind: CiliumNetworkPolicy\nmetadata:\n  name: fqdn-egress\n  namespace: secdemo\nspec:\n  endpointSelector:\n    matchLabels: {role: frontend}\n  egress:\n  - toFQDNs:\n    - matchName: \"one.one.one.one\"\n    toPorts:\n    - ports: [{port: \"443\", protocol: TCP}]\n  - toEndpoints:\n    - matchLabels:\n        \"k8s:io.kubernetes.pod.namespace\": kube-system\n        \"k8s:k8s-app\": kube-dns\n    toPorts:\n    - ports:\n      - port: \"53\"\n        protocol: ANY\n      rules:\n        dns:\n        - matchPattern: \"*\"\nEOF", e:"policy สร้างสำเร็จ — block rules.dns ทำให้ query DNS ถูกส่งผ่าน DNS proxy ของ Cilium ซึ่งเป็นกลไกที่ toFQDNs ใช้เรียนรู้ IP ของโดเมนที่อนุญาต", tr:"ถ้าลืม rules.dns (เขียนแค่ allow port 53 เฉยๆ) toFQDNs จะไม่ทำงานเลย เพราะ Cilium ไม่ได้ดัก DNS response จึงไม่รู้ว่าโดเมนนั้น resolve เป็น IP อะไร — อาการคือ curl ไปยังโดเมนที่อนุญาตแล้วยัง timeout"},
          {i:"ยืนยันว่าโดเมนที่อนุญาตเรียกได้ แต่โดเมนอื่นถูกบล็อก", c:"kubectl -n secdemo exec frontend -- curl -s -o /dev/null -w 'allowed: %{http_code}\\n' https://one.one.one.one --max-time 3\nkubectl -n secdemo exec frontend -- curl -s -o /dev/null -w 'blocked: %{http_code}\\n' https://example.com --max-time 3", e:"บรรทัดแรกได้ 200 หรือ 30x ปกติ ส่วนบรรทัดสอง timeout เพราะไม่อยู่ใน toFQDNs allow-list", tr:"ถ้าทั้งสอง fail ตรวจว่า egress DNS rule (port 53) apply สำเร็จจริงก่อน"}
        ],
        challenge:{ task:"อธิบายว่าทำไม toFQDNs ถึงต้องพึ่งการดักฟัง DNS query (DNS snooping) แทนการเขียน IP ตรงๆ ใน policy", reveal:"โดเมนอย่าง api.stripe.com อาจ resolve เป็น IP หลายตัวและเปลี่ยนได้ตลอดเวลา (โดยเฉพาะบริการที่อยู่หลัง CDN/anycast) ถ้าเขียน IP ตรงๆ ใน policy จะพังทันทีที่ IP เปลี่ยน Cilium จึงดัก DNS response ที่ pod ได้รับ (ผ่าน DNS proxy ภายใน) แล้วอัปเดต allow-list ของ eBPF แบบ dynamic ตาม IP ที่ resolve ได้จริงในขณะนั้น ทำให้ policy อิงชื่อโดเมนได้โดยไม่ต้องรู้ IP ล่วงหน้า"}
      }
    },
    { id:"m4-t3", title:"Encryption in Transit: mTLS และ WireGuard", summary:"เข้ารหัส traffic ระหว่าง node แบบโปร่งใส โดย workload ไม่ต้องรู้ตัว",
      primer:{
        need:"\"เข้ารหัส\" คืออะไร แล้วถ้าไม่เข้ารหัสมีใครอ่านได้บ้าง",
        body:`<p>ข้อมูลที่ส่งแบบไม่เข้ารหัส (<strong>plaintext</strong>) ใครก็ตามที่อยู่<strong>ระหว่างทาง</strong>สามารถอ่านได้ทั้งหมด ไม่ใช่แค่ผู้รับปลายทาง — "ระหว่างทาง" หมายถึงทุกอุปกรณ์ที่ข้อมูลวิ่งผ่าน เช่น switch, router, ผู้ให้บริการเครือข่าย หรือคนที่แอบดักฟังอยู่บนสายเดียวกัน</p>
        <p><strong>การเข้ารหัส</strong> คือการแปลงข้อมูลให้อ่านไม่ออกด้วยกุญแจ (key) ใครดักได้กลางทางก็เห็นเป็นขยะ ถอดไม่ได้ถ้าไม่มีกุญแจ</p>
        <ul>
          <li><strong>symmetric</strong> — ใช้กุญแจดอกเดียวกันทั้งล็อกและปลดล็อก เร็วมาก แต่ปัญหาคือจะส่งกุญแจให้อีกฝั่งอย่างปลอดภัยได้ยังไง</li>
          <li><strong>asymmetric</strong> — มีกุญแจเป็นคู่ ล็อกด้วยดอกหนึ่ง ปลดได้ด้วยอีกดอก ช้ากว่ามาก แต่แก้ปัญหาการแลกกุญแจได้</li>
          <li>ระบบจริงใช้<strong>ทั้งสองอย่าง</strong>: ใช้ asymmetric ตอนเริ่มต้นเพื่อตกลงกุญแจ symmetric แล้วใช้ symmetric ส่งข้อมูลจริงเพราะเร็วกว่า</li>
        </ul>
        <p>ประเด็นของหัวข้อนี้คือ <strong>เข้ารหัสที่ชั้นไหน</strong> — ถ้าเข้ารหัสที่ชั้นล่าง (ระหว่าง node) แอปไม่ต้องแก้อะไรเลยแม้แต่บรรทัดเดียว แต่ถ้าทำที่ชั้นแอป (mTLS) จะรู้ตัวตนของคู่สนทนาด้วย ไม่ใช่แค่กันคนแอบอ่าน</p>`,
        try:[
          {i:"ดักดูข้อมูลที่ยังไม่เข้ารหัส — สร้าง traffic แล้วจับดูว่าอ่านออกไหม", c:"kubectl exec netcheck -- sh -c 'nohup wget -qO- http://web-clusterip >/dev/null 2>&1 &' ; docker exec ckne-worker timeout 5 tcpdump -i any -A -c 20 'tcp port 80' 2>/dev/null | grep -i 'HTTP\\|nginx' | head -5", e:"เห็นข้อความ HTTP อ่านออกเป็นตัวอักษรปกติ — นี่คือสิ่งที่คนกลางเห็นได้ทั้งหมดเมื่อไม่เข้ารหัส (ถ้าไม่เห็นอะไร ลองรันซ้ำให้จังหวะ traffic ตรงกัน)"},
          {i:"ดูว่าตอนนี้คลัสเตอร์เปิดการเข้ารหัสระหว่าง node ไว้หรือยัง", c:"kubectl -n kube-system get cm cilium-config -o jsonpath='{.data.enable-wireguard}{\"\\n\"}'", e:"ถ้าว่างหรือเป็น false แปลว่ายังไม่เข้ารหัส — แล็บข้างล่างจะเปิดให้แล้วกลับมาจับ packet เทียบกันอีกรอบ"}
        ]
      },
      concept:`<p>การเข้ารหัส traffic ระหว่างทางทำได้หลายชั้น แต่ละชั้นมี trade-off ต่างกัน</p>
      <ul>
        <li><strong>mTLS ผ่าน service mesh</strong> — เข้ารหัสและพิสูจน์ตัวตนระดับ application (L7) แต่ละ workload มี certificate ของตัวเอง (มักผูกกับแนวคิด SPIFFE identity) เหมาะกับ zero-trust ระดับละเอียด</li>
        <li><strong>Node-to-node transparent encryption (WireGuard/IPsec)</strong> — เข้ารหัสทุก traffic ที่วิ่งระหว่าง node โดยอัตโนมัติที่ระดับ kernel ไม่ต้องแก้ application เลย เหมาะเป็น baseline encryption ทั้งคลัสเตอร์</li>
        <li>Cilium รองรับทั้งสองแบบ: transparent encryption ผ่าน <code>encryption.type: wireguard</code> (หรือ ipsec) และยังผสานกับ mTLS ระดับ mesh ได้ในเวอร์ชันใหม่</li>
        <li>WireGuard เบากว่า IPsec เพราะ codebase เล็กกว่ามาก และ integrate เข้า Linux kernel โดยตรงตั้งแต่ 5.6</li>
      </ul>`,
      lab:{ title:"เปิด transparent encryption ด้วย WireGuard แล้วยืนยันว่า traffic ถูกเข้ารหัสจริง",
        steps:[
          {i:"เปิด WireGuard encryption บน Cilium ที่ติดตั้งไว้", c:"helm upgrade cilium cilium/cilium --version 1.15.6 -n kube-system --reuse-values \\\n  --set encryption.enabled=true --set encryption.type=wireguard\nkubectl -n kube-system rollout status ds/cilium", e:"DaemonSet cilium restart แล้วขึ้น Ready ครบทุก node ไม่มี error", tr:"ถ้า pod ค้าง CrashLoopBackOff ตรวจว่า kernel รองรับ WireGuard module (modprobe wireguard บน host)"},
          {i:"ตรวจสถานะ encryption ผ่าน cilium CLI ว่าทุก node เชื่อมกันด้วย WireGuard แล้ว", c:"cilium encrypt status", e:"เห็นสถานะ encryption: Wireguard และจำนวน peer ที่เชื่อมสำเร็จเท่ากับจำนวน node ลบหนึ่ง (peer กับ node อื่นทุกตัว)", tr:"ถ้า peer ไม่ครบ ให้รอสักครู่ให้ key exchange เสร็จ หรือตรวจ firewall ระหว่าง Docker network ของ node ไม่ได้บล็อก UDP port ที่ WireGuard ใช้"},
          {i:"ยิง traffic ข้าม node แล้วจับ packet บน physical interface เพื่อยืนยันว่า payload ถูกเข้ารหัส (อ่านไม่ออก)", c:"docker exec -it ckne-worker sh -c 'command -v tcpdump || (apt-get update -qq && apt-get install -y -qq tcpdump)'\ndocker exec -it ckne-worker tcpdump -i any -n udp -c 5 -X", e:"เห็น packet UDP (WireGuard tunnel) ที่ payload เป็นข้อมูลไม่มีความหมาย (encrypted bytes) ต่างจากตอนไม่เข้ารหัสที่เห็น ICMP/HTTP payload อ่านได้ตรงๆ", tr:"ต้องสร้าง traffic ข้าม node ระหว่างจับ packet (เช่น ping จาก netcheck ไป netcheck2) ไม่งั้นจะไม่เห็น packet เลย"}
        ],
        challenge:{ task:"เปรียบเทียบว่า WireGuard transparent encryption กับ mTLS ระดับ service mesh ปกป้องอะไรต่างกัน — ถ้ามีแค่ WireGuard อย่างเดียว ยังมีช่องโหว่อะไรเหลืออยู่", reveal:"WireGuard เข้ารหัสเฉพาะ traffic ระหว่าง node (L3) ป้องกันคนดักฟังบน network ระหว่างทาง (เช่น switch ที่ถูก compromise) แต่ไม่ตรวจสอบ 'ตัวตน' ของ workload ที่คุยกัน — pod ไหนก็คุยกับ pod ไหนได้ถ้า NetworkPolicy อนุญาต โดยไม่มีการพิสูจน์ identity ระดับ application ส่วน mTLS ระดับ mesh พิสูจน์ตัวตนของแต่ละ workload ด้วย certificate ทำให้มั่นใจได้ว่าคู่สนทนาคือ service ที่อ้างว่าเป็นจริงๆ ทั้งสองชั้นจึงเสริมกัน ไม่ใช่แทนกัน"}
      }
    },
    { id:"m4-t4", title:"TLS Termination และ cert-manager", summary:"ออกใบรับรองอัตโนมัติแล้วเสียบเข้า Gateway",
      primer:{
        need:"certificate กับ key ต่างกันยังไง แล้ว CA คือใคร",
        diagram:"tlsHandshake",
        body:`<p>เวลาต่อ HTTPS มีสองสิ่งที่ชื่อคล้ายกันแต่หน้าที่ต่างกันสิ้นเชิง</p>
        <ul>
          <li><strong>private key</strong> — กุญแจลับ <strong>ห้ามให้ใครเห็นเด็ดขาด</strong> เก็บไว้ที่เซิร์ฟเวอร์อย่างเดียว ถ้าหลุดเท่ากับปลอมเป็นเราได้</li>
          <li><strong>certificate</strong> — เอกสารสาธารณะ <strong>แจกได้ ไม่ลับ</strong> ข้างในบอกว่า "โดเมนนี้เป็นของใคร" และมีลายเซ็นของผู้รับรองกำกับไว้</li>
        </ul>
        <p><strong>CA (Certificate Authority)</strong> คือคนกลางที่ทุกฝ่ายเชื่อถือร่วมกัน ทำหน้าที่ตรวจสอบแล้วเซ็นรับรอง certificate ให้ — เบราว์เซอร์และระบบปฏิบัติการมีรายชื่อ CA ที่เชื่อถือติดตั้งมาให้ตั้งแต่แรกอยู่แล้ว</p>
        <p>เทียบกับบัตรประชาชน: ตัวบัตรคือ certificate (แสดงให้คนอื่นดูได้), ลายเซ็นของกรมการปกครองคือ CA รับรอง, ส่วนสิ่งที่พิสูจน์ว่าเราคือเจ้าของบัตรจริงคือ private key</p>
        <p><strong>self-signed</strong> = เซ็นรับรองตัวเอง เหมือนทำบัตรประชาชนเองที่บ้าน ใช้ในแล็บได้เพราะเข้ารหัสได้จริง แต่เบราว์เซอร์จะขึ้นเตือนเพราะไม่มีคนกลางที่เชื่อถือได้มารับรอง</p>`,
        try:[

  blurb:"ถ้า debug ไม่เป็นก็ fix ไม่ได้ — เก็บ metric, สังเกต flow แบบ real-time ด้วย Hubble, และไล่ connection ระดับ packet",
  topics:[
    { id:"m5-t1", title:"Prometheus และ CNI Metrics", summary:"metric อะไรบ้างที่บอกสุขภาพของ network layer และดึงมาดูยังไง",
      primer:{
        need:"metric คืออะไร แล้ว Prometheus ทำอะไรกับมัน",
        body:`<p><strong>metric</strong> คือตัวเลขที่ระบบวัดตัวเองแล้วเปิดให้อ่านได้ เช่น "ทิ้งแพ็กเก็ตไปแล้วกี่ก้อน" — ต่างจาก <strong>log</strong> ตรงที่ log เป็นข้อความบรรยายเหตุการณ์ทีละครั้ง ส่วน metric เป็นตัวเลขสรุปที่เอาไปพล็อตกราฟและตั้งแจ้งเตือนได้ง่ายกว่ามาก</p>
        <p>ชนิดที่เจอบ่อยสองแบบ</p>
        <ul>
          <li><strong>counter</strong> — ตัวนับที่<strong>เพิ่มขึ้นอย่างเดียว ไม่เคยลด</strong> เช่นจำนวนแพ็กเก็ตที่ถูกทิ้งสะสม</li>
          <li><strong>gauge</strong> — ค่าที่ขึ้นลงได้ เช่นจำนวน connection ที่เปิดอยู่ตอนนี้</li>
        </ul>
        <p>จุดที่คนใหม่พลาดบ่อย: <strong>ค่าของ counter ดูตรงๆ ไม่มีความหมาย</strong> เห็นเลข 5,000 แล้วบอกไม่ได้ว่าดีหรือแย่ เพราะเป็นยอดสะสมตั้งแต่เปิดเครื่อง สิ่งที่มีความหมายคือ<strong>มันเพิ่มเร็วแค่ไหน</strong> — ต้องเทียบสองจุดเวลา ซึ่งใน Prometheus ใช้ฟังก์ชัน <code>rate()</code></p>
        <p><strong>Prometheus</strong> ทำงานแบบ <strong>ดึง (scrape)</strong> ไม่ใช่รอรับ — มันจะเข้าไปเรียก URL <code>/metrics</code> ของแต่ละบริการเป็นรอบๆ (เช่นทุก 15 วินาที) แล้วเก็บค่าพร้อมเวลาไว้ ทำให้ย้อนดูอดีตและเทียบช่วงเวลาได้</p>`,
        try:[

          {i:"ดู metric ตัวเดียวกันสองครั้งห่างกัน 5 วินาที เพื่อเข้าใจว่าทำไมต้องดู \"อัตราการเพิ่ม\" ไม่ใช่ค่าดิบ", c:"kubectl -n kube-system exec ds/cilium -- curl -s localhost:9962/metrics | grep '^cilium_forward_count_total' | head -2\nsleep 5\nkubectl -n kube-system exec ds/cilium -- curl -s localhost:9962/metrics | grep '^cilium_forward_count_total' | head -2", e:"ตัวเลขรอบสองมากกว่ารอบแรก (ไม่มีทางน้อยลง เพราะเป็น counter) — ส่วนต่างหารด้วยเวลาคือสิ่งที่ rate() คำนวณให้"}
        ]

      concept:`<p>Cilium expose metric แบบ Prometheus format ในตัว ครอบคลุมทั้ง datapath, policy, และ service — เป็น metric ชุดแรกที่ควรรู้จักก่อนไปตั้ง dashboard เต็มรูปแบบ</p>

        <li><strong>cilium_forward_count_total</strong> — จำนวน packet ที่ผ่านสำเร็จ ใช้เทียบสัดส่วนกับ drop เพื่อดู error rate</li>

        <li>ทุก metric เหล่านี้ scrape ได้ผ่าน endpoint <code>:9962/metrics</code> ของแต่ละ Cilium agent pod — ตั้งแบบ ServiceMonitor ให้ Prometheus ดึงอัตโนมัติได้</li>
      </ul>`,

        prereqs:"ต้องติดตั้ง Cilium ด้วย --set prometheus.enabled=true (ตั้งไว้แล้วใน Module 0) ไม่งั้น port 9962 จะไม่เปิดให้ scrape — ถ้าติดตั้งไปก่อนหน้าโดยไม่มี flag นี้ ให้ helm upgrade --reuse-values เพิ่มเข้าไปก่อน",
        steps:[

          {i:"เปิด terminal ใหม่ แล้วดึง metric ทั้งหมดมากรองหา drop count", c:"curl -s localhost:9962/metrics | grep cilium_drop_count_total", e:"เห็นบรรทัด metric พร้อม label reason=\"...\" และตัวเลขจำนวน packet ที่ถูก drop สะสม", tr:"ถ้าค่าเป็น 0 ทั้งหมด ให้ไปสร้าง traffic ที่ถูกบล็อกจริงก่อน เช่น เรียก endpoint ที่ NetworkPolicy ปฏิเสธจาก topic ก่อนหน้า"},

    { id:"m5-t2", title:"Hubble: สังเกต Flow แบบ Real-Time", summary:"เครื่องมือที่ทรงพลังที่สุดสำหรับ debug NetworkPolicy และ connectivity ใน Cilium",
      diagram:"hubbleFlow",
      primer:{
        need:"\"flow\" คืออะไร ต่างจาก packet ยังไง",
        body:`<p><strong>packet</strong> คือข้อมูลก้อนเล็กๆ หนึ่งก้อน การโหลดหน้าเว็บหน้าเดียวอาจใช้เป็นพันก้อน — ดูทีละก้อนจึงเยอะเกินกว่าจะเข้าใจภาพรวม</p>
        <p><strong>flow</strong> คือการ<strong>จับกลุ่ม packet ที่เป็นบทสนทนาเดียวกัน</strong>มาสรุปเป็นบรรทัดเดียว "ใครคุยกับใคร ที่ port ไหน ผลเป็นยังไง" — อ่านง่ายกว่ามาก</p>
        <p>สิ่งที่ใช้ระบุว่าเป็นบทสนทนาเดียวกันเรียกว่า <strong>5-tuple</strong> คือข้อมูล 5 อย่างประกอบกัน: source IP, source port, destination IP, destination port และ protocol — ถ้าห้าอย่างนี้ตรงกันหมด ถือว่าเป็น flow เดียวกัน</p>
        <p>คำที่จะเจอบ่อยตอนอ่านผลลัพธ์</p>
        <ul>
          <li><strong>verdict</strong> — คำตัดสินของแต่ละ flow: <code>FORWARDED</code> (ปล่อยผ่าน) หรือ <code>DROPPED</code> (ทิ้ง)</li>
          <li><strong>drop reason</strong> — เหตุผลที่ถูกทิ้ง เช่น <code>POLICY_DENIED</code> แปลว่าโดน NetworkPolicy บล็อก</li>
        </ul>
        <p>ทำไมเครื่องมือนี้ถึงมีค่ามาก: เวลาแอปเชื่อมต่อไม่ได้ ฝั่งแอปจะเห็นแค่ "timeout" ซึ่งบอกไม่ได้เลยว่าเพราะอะไร แต่ flow log บอกตรงๆ ว่าถูกใครบล็อกและด้วยเหตุผลอะไร</p>`,
        try:[
          {i:"ดูรายชื่อ pod ที่กำลังคุยกันอยู่ตอนนี้ (ยังไม่ต้องใช้ hubble — ดูจาก connection ที่เปิดอยู่ก่อน)", c:"kubectl exec dns-test -- netstat -tn 2>/dev/null | head -5 || kubectl exec dns-test -- ss -tn | head -5", e:"แต่ละบรรทัดคือหนึ่งบทสนทนา มี IP:port ของทั้งสองฝั่ง — นี่คือแนวคิดเดียวกับ flow แต่เห็นเฉพาะจากมุมของ pod ตัวนี้"},
          {i:"สร้าง flow ที่จะถูกบล็อกเพื่อเอาไว้ตามหาในแล็บข้างล่าง", c:"kubectl -n secdemo exec frontend -- curl -s -X POST --max-time 3 http://backend/ || echo '(ถูกบล็อก — ฝั่งผู้เรียกเห็นแค่เท่านี้)'", e:"ฝั่งผู้เรียกได้แค่ความเงียบหรือ timeout ไม่รู้สาเหตุ — แล็บข้างล่างจะใช้ Hubble หาคำตอบว่าใครบล็อกและเพราะอะไร"}
        ]
      },
      concept:`<p><strong>Hubble</strong> คือ observability layer ของ Cilium ที่แสดง flow (การเชื่อมต่อ) ทุกเส้นในคลัสเตอร์แบบ near real-time พร้อมบอกว่าแต่ละ flow ถูก <strong>allow</strong> หรือ <strong>drop</strong> โดย policy ตัวไหน</p>
      <ul>
        <li><strong>Hubble (per-node)</strong> — เก็บ flow log จาก eBPF datapath ของ node ตัวเอง</li>
        <li><strong>Hubble Relay</strong> — รวม flow จากทุก node เข้าเป็น cluster-wide view เดียว</li>
        <li><strong>hubble observe</strong> — CLI หลักที่ filter flow ได้ตาม namespace, pod, verdict (FORWARDED/DROPPED), protocol</li>
        <li>เป็นเครื่องมือ debug NetworkPolicy ที่เร็วที่สุด — เห็นได้ทันทีว่า traffic ถูกบล็อกโดย policy ชื่ออะไร ไม่ต้องเดาจาก log ของ application</li>
      </ul>`,
      lab:{ title:"เปิด Hubble แล้วไล่หา flow ที่ถูกบล็อกโดย NetworkPolicy",
        prereqs:"Hubble relay/UI ถูกเปิดไว้แล้วตั้งแต่ Module 0 — แต่ต้องติดตั้ง hubble CLI เพิ่มด้วย (คนละ binary กับ cilium CLI): ดาวน์โหลดจาก github.com/cilium/hubble/releases แล้ววางไว้ใน PATH",
        steps:[
          {i:"เปิด hubble CLI ให้ port-forward ไปยัง Hubble Relay", c:"cilium hubble port-forward &", e:"terminal แสดงว่า port-forward ไปยัง hubble-relay สำเร็จ (background job)", tr:"ถ้า job ค้าง ใช้ jobs แล้ว kill %1 เพื่อยกเลิกก่อนลองใหม่"},
          {i:"ดู flow ทั้งหมดใน namespace secdemo แบบ live ระหว่างสร้าง traffic คู่ขนาน", c:"hubble observe --namespace secdemo --follow", e:"เห็น log ไหลต่อเนื่อง แต่ละบรรทัดมี SOURCE, DESTINATION, VERDICT (FORWARDED/DROPPED), และ TYPE ของ packet", tr:"ถ้าไม่เห็นอะไรเลยเพราะไม่มี traffic ใหม่ ให้เปิด terminal อีกอันยิง curl ตามขั้นตอนถัดไปพร้อมกัน"},
          {i:"เปิด terminal ใหม่ ยิง request ทั้งที่ควรผ่านและควรถูกบล็อกพร้อมกัน", c:"kubectl -n secdemo exec frontend -- curl -s backend --max-time 2\nkubectl -n secdemo exec frontend -- curl -s -X POST backend --max-time 2", e:"กลับไปดู terminal hubble observe จะเห็นทั้งสอง flow นี้ปรากฏขึ้นทันที", tr:"ถ้า hubble ไม่จับ flow ใหม่เลย ตรวจว่า Hubble ถูกเปิดที่ node ที่ pod frontend/backend รันอยู่จริง (Hubble ทำงานระดับ node)"},
          {i:"filter เฉพาะ flow ที่ถูก DROP เพื่อดูว่า policy ไหนเป็นคนบล็อก", c:"hubble observe --namespace secdemo --verdict DROPPED -o json | grep -o '\"policy_match_type\":[^,]*\\|\"drop_reason_desc\":\"[^\"]*\"' | head -5", e:"เห็น drop_reason_desc เช่น POLICY_DENIED ยืนยันว่า flow ถูกบล็อกโดย L7 policy จาก Module 4 ไม่ใช่ปัญหา network อื่น", tr:"ถ้า output JSON ซับซ้อนเกินไป ตัด grep ออกแล้วอ่าน raw JSON ทีละบรรทัดแทนเพื่อความชัดเจน"}
        ],
        challenge:{ task:"ใช้ hubble observe เปรียบเทียบ latency คร่าวๆ ระหว่าง flow ที่ผ่าน L7 policy (ต้องผ่าน Envoy proxy) กับ flow ที่ไม่มี L7 policy เลย — คาดว่าต่างกันอย่างไรและทำไม", reveal:"flow ที่ต้องผ่าน L7 policy (HTTP method/path matching) จะมี latency เพิ่มขึ้นเล็กน้อยเพราะ packet ต้องถูกส่งผ่าน Envoy proxy ภายในของ Cilium เพื่อตรวจสอบเนื้อหาระดับ application ก่อนตัดสินใจ ต่างจาก flow ที่ควบคุมแค่ L3/L4 ซึ่งตัดสินใจได้ทั้งหมดใน eBPF datapath โดยไม่ต้อง proxy เลย จึงเร็วกว่า — เป็น trade-off ระหว่างความละเอียดของ policy กับ performance"}
      }
    },
    { id:"m5-t3", title:"Packet และ Connection-Level Tooling", summary:"tcpdump, conntrack, ss — เครื่องมือ Linux มาตรฐานที่ยังจำเป็นแม้มี Hubble แล้ว",
      primer:{
        need:"TCP connection มีสถานะอะไรบ้าง แล้วทำไมต้องดูถึงระดับ packet",
        body:`<p>TCP ไม่ได้ยิงข้อมูลทิ้งเลย แต่<strong>ต่อสายก่อนคุย</strong> — ขั้นตอนนี้เรียก <strong>three-way handshake</strong>: ฝั่งเริ่มส่ง SYN (ขอต่อ) ปลายทางตอบ SYN-ACK (รับทราบ พร้อม) แล้วฝั่งเริ่มตอบ ACK อีกที ถึงเริ่มส่งข้อมูลจริงได้</p>
        <p>สถานะที่จะเจอตอนอ่านผลลัพธ์ และความหมายเวลา debug</p>
        <ul>
          <li><strong>ESTABLISHED</strong> — ต่อสำเร็จ กำลังคุยกันอยู่ ปกติดี</li>
          <li><strong>SYN-SENT</strong> — ส่ง SYN ไปแล้วแต่<strong>ยังไม่มีใครตอบ</strong> ถ้าค้างอยู่ท่านี้นานๆ มักแปลว่าโดน firewall ทิ้งเงียบ หรือปลายทางไม่มีอยู่จริง</li>
          <li><strong>TIME-WAIT</strong> — ปิดไปแล้วแต่ระบบยังกันเบอร์ไว้สักครู่กันของเก่าหลงมา ปกติไม่ต้องตกใจ</li>
        </ul>
        <p>ทำไมยังต้องใช้เครื่องมือระดับ packet ทั้งที่มี Hubble แล้ว: Hubble ตอบเก่งเรื่อง "โดน policy บล็อกไหม" แต่ถ้าปัญหาอยู่ต่ำกว่านั้น — เช่นแพ็กเก็ตใหญ่เกินจนไปไม่รอด (MTU), ปลายทางรีเซ็ตการเชื่อมต่อทิ้ง, หรือแอปเองไม่ตอบ — ต้องลงไปดูของจริงถึงจะเห็น</p>`,
        try:[
          {i:"ดูสถานะ connection ที่เปิดอยู่จริงในเครื่อง", c:"kubectl exec dns-test -- sh -c 'wget -qO- http://web-clusterip >/dev/null & sleep 1; ss -tn state all | head -6'", e:"เห็นคอลัมน์สถานะ เช่น ESTAB — ถ้าเจอ SYN-SENT ค้าง แปลว่ากำลังต่อไม่ติด"},
          {i:"เทียบ: ลองต่อไปยัง port ที่ไม่มีใครเปิดรอ ดูว่าอาการต่างจากตอนปกติยังไง", c:"kubectl exec dns-test -- sh -c 'nc -zv -w 3 web-clusterip 9999 2>&1; nc -zv -w 3 web-clusterip 80 2>&1'", e:"port 9999 ถูกปฏิเสธหรือ timeout ส่วน port 80 ต่อได้ — ความต่างของสองอาการนี้คือเบาะแสสำคัญตอน debug จริง"}
        ]
      },
      concept:`<p>Hubble เก่งเรื่อง policy verdict แต่บางครั้งต้องลงลึกกว่านั้นถึงระดับ packet/connection จริง — นี่คือเครื่องมือ Linux มาตรฐานที่ CKNE คาดหวังให้ใช้คล่อง</p>
      <ul>
        <li><strong>tcpdump</strong> — จับ packet ดิบบน interface ที่ระบุ ใช้ debug เมื่อสงสัยว่าปัญหาอยู่ต่ำกว่าระดับที่ Hubble มองเห็น (เช่น malformed packet, MTU issue)</li>
        <li><strong>conntrack -L</strong> — list connection tracking table ของ kernel บอกว่า connection ไหนกำลัง active, state อะไร (ESTABLISHED, TIME_WAIT) — สำคัญมากสำหรับ debug NAT/DNAT ของ Service</li>
        <li><strong>ss -tnp</strong> — list TCP socket ที่เปิดอยู่บน host/container พร้อม process ที่เป็นเจ้าของ ใช้หา process ที่ค้าง connection ผิดปกติ</li>
        <li>ลำดับการ debug ที่แนะนำ: <strong>Hubble ก่อน</strong> (เห็นภาพรวม verdict เร็วสุด) → <strong>conntrack</strong> (ยืนยันสถานะ connection) → <strong>tcpdump</strong> (ดู payload จริงเมื่อจำเป็น)</li>
      </ul>`,
      lab:{ title:"ไล่ connection จาก conntrack กลับไปหา pod เจ้าของ",
        steps:[
          {i:"สร้าง long-lived connection ค้างไว้เพื่อให้มีอะไรให้ไล่", c:"kubectl -n secdemo exec frontend -- sh -c 'while true; do curl -s backend -o /dev/null; sleep 1; done' &", e:"background job ยิง curl ทุกวินาทีต่อเนื่อง (รันฝั่ง client ผ่าน kubectl exec ค้างไว้)", tr:"ถ้า kubectl exec หลุดเพราะ timeout ให้เปิด terminal แยกไว้เฉพาะสำหรับ job นี้"},
          {i:"หาว่า pod backend รันอยู่ node ไหน แล้วเข้า node นั้น (ไม่ใช่ ckne-worker เสมอไป) เพื่อดู conntrack table", c:"NODE=$(kubectl -n secdemo get pod -l app=backend -o jsonpath='{.items[0].spec.nodeName}')\nPODIP=$(kubectl -n secdemo get pod -l app=backend -o jsonpath='{.items[0].status.podIP}')\necho \"backend อยู่บน $NODE ที่ IP $PODIP\"\ndocker exec -it $NODE conntrack -L | grep $PODIP", e:"เห็นบรรทัด connection state ESTABLISHED ระหว่าง IP ของ frontend กับ backend พร้อม source/destination port", tr:"ถ้า conntrack ไม่มีในเครื่อง node ให้ docker exec -it $NODE apt-get update && apt-get install -y conntrack ก่อน (kind node เป็น container ที่ install เพิ่มได้)"},
          {i:"ใช้ ss ดู socket ฝั่ง backend ว่า process ไหนถือ connection นี้อยู่", c:"kubectl -n secdemo exec deploy/backend -- ss -tnp | grep ESTAB", e:"เห็นบรรทัด ESTAB พร้อม local/peer address:port และ process nginx ที่ถือ socket นั้นอยู่", tr:"ถ้า image nginx ไม่มี ss ในตัว ให้ kubectl debug หรือใช้ nicolaka/netshoot เป็น ephemeral container แนบเข้าไปแทน"},
          {i:"หยุด background job เพื่อความสะอาดของ lab environment", c:"kill %1", e:"background curl loop หยุดทำงาน", tr:"ถ้าจำ job number ไม่ได้ ใช้ jobs ดูลิสต์ก่อน kill"}
        ],
        challenge:{ task:"สมมติมี Service ที่ traffic บางส่วนหายไปเป็นระยะ (intermittent packet loss) จะใช้ conntrack, ss, tcpdump ไล่หาสาเหตุตามลำดับอย่างไร", reveal:"เริ่มจาก ss -tnp ฝั่ง client/server ดูว่ามี connection ที่ค้าง state ผิดปกติ (เช่น SYN-SENT ค้างนาน) หรือไม่ ตามด้วย conntrack -L กรองตาม 5-tuple ของ connection ที่มีปัญหา ดูว่า entry หายไปจาก table กลางทาง (อาจเกิดจาก conntrack table เต็มทำให้ kernel drop entry ใหม่) สุดท้ายใช้ tcpdump จับที่ทั้งสองฝั่งพร้อมกันเปรียบเทียบว่า packet ที่ client ส่งไปถึง server จริงหรือไม่ ถ้าถึงแต่ server ไม่ตอบ ปัญหาน่าจะอยู่ที่ application ไม่ใช่ network"}
      }
    }

const STORE_KEY = "ckne-course-progress-v2";
function defaultState(){ return { completedTopics:{}, labSteps:{}, primerSteps:{}, quizScores:{}, lastRoute:null, theme:null }; }
function loadState(){
  const def = defaultState();
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      if(p && typeof p === "object"){
        const obj = (v)=> (v && typeof v === "object" && !Array.isArray(v)) ? v : {};
        /* คะแนนถูกเอาไปต่อเป็น HTML โดยตรง จึงต้องบังคับให้เป็นตัวเลขตั้งแต่ตอนอ่านเข้ามา
           ถ้าปล่อยค่าดิบจาก localStorage ผ่านไปได้ สตริงอย่าง <img onerror=...> จะกลายเป็น DOM จริง */
        const scores = (v)=>{
          const out = {};
          if(v && typeof v === "object" && !Array.isArray(v)){
            for(const k of Object.keys(v)){
              const e = v[k];
              if(!e || typeof e !== "object") continue;
              const total = Number(e.total), score = Number(e.score);
              if(!Number.isFinite(total) || !Number.isFinite(score) || total <= 0) continue;
              out[k] = { score: Math.min(Math.max(Math.round(score),0), Math.round(total)),
                         total: Math.round(total),
                         ts: Number.isFinite(Number(e.ts)) ? Number(e.ts) : 0 };
            }
          }
          return out;
        };
        return Object.assign(def, p, {
          completedTopics: obj(p.completedTopics),
          labSteps: obj(p.labSteps),
          primerSteps: obj(p.primerSteps),
          quizScores: scores(p.quizScores),
          /* ต้อง validate ด้วย — ถ้าเป็นค่าอื่นที่ไม่ใช่ string จะทำให้ dashboard พังทั้งหน้า */
          lastRoute: (typeof p.lastRoute === "string" && /^#\/[A-Za-z0-9/_-]{1,120}$/.test(p.lastRoute)) ? p.lastRoute : null,
          theme: (p.theme === "dark" || p.theme === "light") ? p.theme : null
        });
      }
    }
  }catch(e){}
  return def;
}
function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
let state = loadState();

  const root = document.documentElement;
  if(state.theme === "light"){ root.setAttribute("data-theme","light"); }
  else if(state.theme === "dark"){ root.setAttribute("data-theme","dark"); }
  else { root.removeAttribute("data-theme"); }
}
document.getElementById("themeBtn").addEventListener("click", ()=>{
  const order = [null,"dark","light"];
  const cur = order.indexOf(state.theme);
  state.theme = order[(cur+1)%order.length];
  applyTheme(); saveState();
});
applyTheme();

/* ============ HELPERS ============ */
/* escapes for both text and attribute contexts (lab commands contain " and ') */
function esc(s){ return (s||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function findTopic(topicId){
  for(const m of MODULES){
    const t = m.topics.find(x=>x.id===topicId);
    if(t) return {m,t};
  }
  return null;
}
function labStepCount(t){ return t.lab ? t.lab.steps.length : 0; }
/* clamp กับจำนวน step ปัจจุบันเสมอ — ถ้าเนื้อหาถูกแก้ให้ step น้อยลง ค่าที่ค้างใน localStorage
   จะดันสัดส่วนเกิน 100% ได้ และถ้าค่าที่เก็บไว้ไม่ใช่ array จะทำให้ทั้งหน้าพัง */
function labStepsDone(topicId, max){
  const arr = state.labSteps[topicId];
  if(!Array.isArray(arr)) return 0;
  const slice = (typeof max === "number") ? arr.slice(0, max) : arr;
  return slice.filter(Boolean).length;
}
function topicFraction(t){
  const n = labStepCount(t);
  const total = 1 + n;
  let done = state.completedTopics[t.id] ? 1 : 0;
  done += labStepsDone(t.id, n);
  return Math.min(done/total, 1);
}
function moduleFraction(m){
  if(!m.topics.length) return 0;
  const sum = m.topics.reduce((a,t)=>a+topicFraction(t),0);
  return sum/m.topics.length;
}
function overallFraction(){
  const examModules = MODULES.filter(m=>m.weight>0);
  const totalW = examModules.reduce((a,m)=>a+m.weight,0);
  if(!totalW) return 0;
  return examModules.reduce((a,m)=>a+moduleFraction(m)*m.weight,0)/totalW;
}
function updateTopProgress(){
  const pct = Math.round(overallFraction()*100);
  document.getElementById("topProgressFill").style.width = pct+"%";
  document.getElementById("topProgressLabel").textContent = pct+"% พร้อมสอบ";
}

/* ============ ROUTER ============ */
function go(route){ location.hash = route; }
window.addEventListener("hashchange", render);
document.getElementById("brandBtn").addEventListener("click", ()=>go("#/dashboard"));
document.getElementById("menuBtn").addEventListener("click", ()=>{
  document.getElementById("sidebar").classList.toggle("open");
});

/* ============ SIDEBAR ============ */
function renderSidebar(){
  const side = document.getElementById("sidebar");
  const hash = location.hash;
  let html = `<button class="side-mod" onclick="go('#/dashboard')" style="margin-bottom:10px"><span class="num">::</span>ภาพรวม / Dashboard</button>`;
  MODULES.forEach((m,mi)=>{
    html += `<div class="side-group"><button class="side-mod" onclick="go('#/module/${m.id}')"><span class="num">${mi===0?'00':('0'+mi)}</span>${esc(m.short)}${m.weight>0?`<span class="w">${m.weight}%</span>`:''}</button>`;
    html += `<div class="side-topics">`;
    m.topics.forEach(t=>{
      const frac = topicFraction(t);
      const cls = frac>=0.999?"done":(frac>0?"partial":"");
      const active = hash.includes(`/topic/${t.id}`) ? "active":"";
      html += `<button class="side-topic ${cls} ${active}" onclick="go('#/module/${m.id}/topic/${t.id}')"><span class="dot"></span>${esc(t.title)}</button>`;
    });
    if(m.quiz && m.quiz.length){
      const active = hash.includes(`/quiz/${m.id}`) ? "active":"";
      html += `<button class="side-topic ${active}" onclick="go('#/quiz/${m.id}')"><span class="dot"></span>แบบทดสอบท้ายบท</button>`;
    }
    html += `</div></div>`;
  });
  html += `<button class="side-mod" onclick="go('#/mock-exam')" style="margin-top:10px"><span class="num">FN</span>Mock Exam</button>`;
  side.innerHTML = html;
}

/* ============ RENDER: DASHBOARD ============ */
function renderDashboard(){
  const pct = Math.round(overallFraction()*100);
  let rows = MODULES.filter(m=>m.weight>0).map(m=>{
    const p = Math.round(moduleFraction(m)*100);
    return `<div class="bp-row"><span class="lbl">${esc(m.short)}</span><span class="bp-bar"><i style="width:${p}%"></i></span><span class="pct">${m.weight}%</span></div>`;
  }).join("");
  let tiles = MODULES.map((m,mi)=>{
    const p = Math.round(moduleFraction(m)*100);
    const q = state.quizScores[m.id];
    const quizLine = q ? ` · quiz ${Number(q.score)|0}/${Number(q.total)|0}` : (m.quiz && m.quiz.length ? " · ยังไม่ได้ทำ quiz" : "");
    return `<button class="tile" onclick="go('#/module/${m.id}')">
      <div class="tile-top"><h3>${mi===0?'Setup':'Module '+mi+' · '+esc(m.short)}</h3>${m.weight>0?`<span class="badge">${m.weight}%</span>`:''}</div>
      <p>${esc(m.blurb)}</p>
      <span class="stat">${p}% complete · ${m.topics.length} topics${quizLine}</span>
    </button>`;
  }).join("");

  const resume = (typeof state.lastRoute === "string") ? findTopic(state.lastRoute.split("/topic/")[1] || "") : null;
  /* สร้าง route ใหม่จาก id ที่ resolve ได้จริง แทนการยัดค่าดิบจาก localStorage ลง onclick */
  const resumeBtn = resume
    ? `<button class="nav-btn" onclick="go('#/module/${esc(resume.m.id)}/topic/${esc(resume.t.id)}')" style="border-color:var(--accent)">เรียนต่อ: ${esc(resume.t.title)} →</button>`
    : `<button class="nav-btn" onclick="go('#/module/m0')" style="border-color:var(--accent)">เริ่มที่ Module 0 · เตรียม Lab →</button>`;

  const mock = state.quizScores["mock"];
  const mockLine = mock
    ? `Mock exam ล่าสุด: <strong>${Number(mock.score)|0}/${Number(mock.total)|0}</strong>`
    : `ยังไม่ได้ลอง mock exam`;

  document.getElementById("main").innerHTML = `
    <div class="eyebrow">CKNE · Certified Kubernetes Network Engineer</div>
    <h1 class="h1">แผนการเตรียมสอบของคุณ</h1>
    <p class="lede">คอร์สนี้เรียงตาม official blueprint 5 domain ของ CKNE (BETA, 2 ชั่วโมง, performance-based) แต่ละหัวข้อมี concept สั้นๆ ตามด้วย hands-on lab ที่รันบน cluster จริง เพราะข้อสอบจริงคือการลงมือทำ ไม่ใช่ข้อสอบปรนัย</p>
    <p class="lede" style="margin-top:-.4em"><strong style="color:var(--flow)">เพิ่งเริ่มต้น?</strong> ทุกหัวข้อมีกล่อง <strong>“พื้นฐาน”</strong> พับไว้ด้านบน อธิบายศัพท์และแนวคิดที่หัวข้อนั้นถือว่าคุณรู้แล้ว (ทั้งฝั่ง Kubernetes และฝั่ง network) พร้อมคำสั่งให้ลองเองสั้นๆ — กดเปิดเมื่อไม่แน่ใจ ข้ามได้ถ้ารู้อยู่แล้ว</p>
    <div class="dash-hero">
      <div class="dash-stat"><div class="n">${pct}%</div><div class="l">Overall Readiness</div></div>
      <div class="bp-chart">${rows}</div>
    </div>
    <div class="section" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      ${resumeBtn}
      <button class="nav-btn" onclick="go('#/mock-exam')">Mock Exam</button>
      <span class="progress-label">${mockLine}</span>
    </div>
    <div class="section"><h2>โมดูล</h2><div class="grid-tiles">${tiles}</div></div>
    <div class="footer-note">Progress ถูกบันทึกไว้ใน browser นี้เท่านั้น (localStorage) — เปิดคอร์สนี้จากเครื่อง/เบราว์เซอร์เดิมเพื่อดำเนินการต่อ</div>

/* ============ RENDER: MODULE OVERVIEW ============ */
function renderModule(modId){
  const m = MODULES.find(x=>x.id===modId);
  if(!m){ go("#/dashboard"); return; }
  let list = m.topics.map((t,ti)=>{
    const p = Math.round(topicFraction(t)*100);
    return `<button class="tile" onclick="go('#/module/${m.id}/topic/${t.id}')">
      <div class="tile-top"><h3>${ti+1}. ${esc(t.title)}</h3></div>
      <p>${esc(t.summary)}</p>
      <span class="stat">${p}% · ${labStepCount(t)} lab steps</span>
    </button>`;
  }).join("");
  document.getElementById("main").innerHTML = `
    <div class="eyebrow">Module${m.weight>0?` · น้ำหนักข้อสอบ ${m.weight}%`:''}</div>
    <h1 class="h1">${esc(m.title)}</h1>
    <p class="lede">${esc(m.blurb)}</p>
    <div class="grid-tiles">${list}</div>
    ${m.quiz && m.quiz.length? `<div class="section" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <button class="nav-btn" onclick="go('#/quiz/${m.id}')">${state.quizScores[m.id]?'ทำแบบทดสอบอีกครั้ง':'ทำแบบทดสอบท้ายบท'} (${m.quiz.length} ข้อ) →</button>
      ${state.quizScores[m.id]?`<span class="progress-label">คะแนนล่าสุด: ${Number(state.quizScores[m.id].score)|0}/${Number(state.quizScores[m.id].total)|0}</span>`:''}
    </div>`:''}
  `;
}

/* ============ RENDER: TOPIC ============ */
function renderTopic(modId, topId){
  const m = MODULES.find(x=>x.id===modId);
  const ti = m ? m.topics.findIndex(x=>x.id===topId) : -1;
  if(!m || ti===-1){ go("#/dashboard"); return; }
  const t = m.topics[ti];
  state.lastRoute = `#/module/${m.id}/topic/${t.id}`; saveState();

  let diagramHtml = "";
  if(t.diagram && DIAGRAMS[t.diagram]) diagramHtml = `<div class="section">${DIAGRAMS[t.diagram]()}</div>`;

  /* primer: ชั้นปูพื้นสำหรับผู้เริ่มต้น — ปิดไว้เป็นค่าเริ่มต้นเพื่อไม่ขวางคนที่รู้อยู่แล้ว */
  let primerHtml = "";
  if(t.primer){
    const pDone = state.primerSteps[t.id] || [];
    const tries = t.primer.try || [];
    const pDiagram = (t.primer.diagram && DIAGRAMS[t.primer.diagram]) ? DIAGRAMS[t.primer.diagram]() : "";
    const trySteps = tries.map((s,si)=>`<div class="p-step">
        <input type="checkbox" ${pDone[si]?"checked":""} onchange="togglePrimerStep('${t.id}',${si},this.checked)">
        <div class="p-step-body">
          <div class="p-step-instr">${esc(s.i)}</div>
          <div class="cmd-block">
            <div class="cmd-bar"><span class="cmd-lang">shell</span><button class="copy-btn" onclick="copyCmd(this)" data-cmd="${esc(s.c)}">คัดลอก</button></div>
            <div class="cmd-scroll"><pre>${esc(s.c)}</pre></div>
          </div>
          <div class="p-step-expect">→ ${esc(s.e)}</div>
        </div>
      </div>`).join("");
    const tryHtml = tries.length ? `<div class="p-try"><div class="p-try-head">ลองเองใน 2 นาที</div>${trySteps}</div>` : "";
    const counter = tries.length ? `<span class="p-count">พื้นฐาน ${pDone.filter(Boolean).length}/${tries.length}</span>` : "";
    primerHtml = `<details class="primer">
      <summary><span class="p-tag">พื้นฐาน</span><span class="p-need">${esc(t.primer.need)}</span>${counter}</summary>
      <div class="primer-body">${t.primer.body}${pDiagram}${tryHtml}</div>
    </details>`;
  }

  let labHtml = "";
  if(t.lab){
    const doneArr = state.labSteps[t.id] || [];
    const steps = t.lab.steps.map((s,si)=>{
      const checked = doneArr[si] ? "checked" : "";
      return `<div class="step">
        <div class="step-head">
          <input type="checkbox" class="step-check" ${checked} onchange="toggleStep('${t.id}',${si},this.checked)">
          <span class="step-num">${String(si+1).padStart(2,'0')}</span>
          <div class="step-body">
            <div class="step-instr">${esc(s.i)}</div>
            <div class="cmd-block">
              <div class="cmd-bar"><span class="cmd-lang">shell</span><button class="copy-btn" onclick="copyCmd(this)" data-cmd="${esc(s.c)}">คัดลอก</button></div>
              <div class="cmd-scroll"><pre>${esc(s.c)}</pre></div>
            </div>
            <details class="disclose expect"><summary>ผลลัพธ์ที่ควรเห็น</summary><div class="box">${esc(s.e)}</div></details>
            <details class="disclose trouble"><summary>ถ้าไม่สำเร็จ</summary><div class="box">${esc(s.tr)}</div></details>
          </div>
        </div>
      </div>`;
    }).join("");
    const challenge = t.lab.challenge ? `<div class="challenge">
        <h4>Challenge</h4>
        <div>${esc(t.lab.challenge.task)}</div>
        <button class="reveal-btn" onclick="this.nextElementSibling.style.display='block';this.style.display='none'">เฉลยแนวทาง</button>
        <div style="display:none;margin-top:10px;font-size:.85rem;color:var(--text-dim)">${esc(t.lab.challenge.reveal)}</div>
      </div>` : "";
    labHtml = `<div class="section lab">
      <div class="lab-head"><span class="tag">Hands-on Lab</span><h3>${esc(t.lab.title||'ลงมือทำ')}</h3></div>
      ${t.lab.prereqs?`<div class="lab-prereq"><strong>ก่อนเริ่ม:</strong> ${esc(t.lab.prereqs)}</div>`:''}
      ${steps}
      ${challenge}
    </div>`;
  }

  const done = !!state.completedTopics[t.id];
  const prevTopic = ti>0 ? m.topics[ti-1] : null;
  const nextTopic = ti<m.topics.length-1 ? m.topics[ti+1] : null;

  document.getElementById("main").innerHTML = `
    <div class="eyebrow">${esc(m.title)}</div>
    <h1 class="h1">${esc(t.title)}</h1>
    ${primerHtml}
    <div class="section card concept">${t.concept}</div>
    ${diagramHtml}
    ${labHtml}
    <div class="mark-row">
      <button class="mark-btn ${done?'done':''}" onclick="toggleTopic('${t.id}')">${done? '✓ อ่านจบแล้ว' : 'ทำเครื่องหมายว่าอ่านจบ'}</button>
      <div class="nav-btns">
        ${prevTopic?`<button class="nav-btn" onclick="go('#/module/${m.id}/topic/${prevTopic.id}')">← ${esc(prevTopic.title)}</button>`:`<button class="nav-btn" onclick="go('#/module/${m.id}')">← ภาพรวมโมดูล</button>`}
        ${nextTopic?`<button class="nav-btn" onclick="go('#/module/${m.id}/topic/${nextTopic.id}')">${esc(nextTopic.title)} →</button>`:(m.quiz&&m.quiz.length?`<button class="nav-btn" onclick="go('#/quiz/${m.id}')">ทำแบบทดสอบ →</button>`:`<button class="nav-btn" onclick="go('#/dashboard')">กลับ Dashboard →</button>`)}
      </div>
    </div>
  `;
}
function toggleTopic(topicId){
  state.completedTopics[topicId] = !state.completedTopics[topicId];
  saveState();
  keepScroll = true;   /* ปุ่มนี้อยู่ท้ายหน้า — ถ้าปล่อยให้ render เด้งขึ้นบนจะเสียตำแหน่งที่อ่านค้างไว้ */
  render();
}
function toggleStep(topicId, idx, val){
  if(!Array.isArray(state.labSteps[topicId])) state.labSteps[topicId]=[];
  state.labSteps[topicId][idx]=val;
  saveState(); renderSidebar(); updateTopProgress();
}
/* primer steps เก็บแยกและไม่นับรวมใน % พร้อมสอบ — readiness ถ่วงน้ำหนักตาม blueprint ข้อสอบเท่านั้น */
function togglePrimerStep(topicId, idx, val){
  if(!Array.isArray(state.primerSteps[topicId])) state.primerSteps[topicId]=[];
  state.primerSteps[topicId][idx]=val;
  saveState();
  const done = state.primerSteps[topicId].filter(Boolean).length;
  const el = document.querySelector(".primer .p-count");
  if(el){ const total = el.textContent.split("/")[1]; el.textContent = `พื้นฐาน ${done}/${total}`; }
}
function copyCmd(btn){
  const txt = btn.getAttribute("data-cmd");
  const flash = (msg,ms)=>{ btn.textContent=msg; setTimeout(()=>btn.textContent="คัดลอก",ms); };
  try{
    navigator.clipboard.writeText(txt).then(()=>flash("คัดลอกแล้ว",1200), ()=>flash("คัดลอกไม่ได้",1600));
  }catch(e){ flash("คัดลอกไม่ได้",1600); }
}

/* ============ RENDER: QUIZ ============ */
/* สลับลำดับตัวเลือกตอน render ทุกครั้ง (รวมตอนกด "ทำใหม่")
   ค่า value/data-oi ยังเป็น index เดิมของข้อมูล การให้คะแนนจึงไม่ต้องแก้อะไร
   จุดประสงค์: กันการเดาจากตำแหน่ง และกันการจำว่า "ข้อนี้ตอบ ข." ตอนทำซ้ำ */
function shuffledOrder(n){
  const a = Array.from({length:n},(_,i)=>i);
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function renderQuizGeneric(title, questions, onFinish, backRoute, backLabel){
  let qs = questions.map((q,qi)=>{
    let opts = shuffledOrder(q.options.length).map(oi=>`<label class="opt" data-qi="${qi}" data-oi="${oi}"><input type="radio" name="q${qi}" value="${oi}">${esc(q.options[oi])}</label>`).join("");
    return `<div class="quiz-q" id="qwrap-${qi}"><p class="qtext">${qi+1}. ${esc(q.q)}</p>${opts}<div class="qexplain" id="explain-${qi}">${esc(q.explain)}</div></div>`;
  }).join("");
  document.getElementById("main").innerHTML = `
    <div class="eyebrow">Quiz · ${questions.length} ข้อ</div>
    <h1 class="h1">${esc(title)}</h1>
    <div class="card">${qs}<button class="quiz-submit" id="quizSubmit">ส่งคำตอบ</button><div class="quiz-result" id="quizResult"></div></div>
    <div class="mark-row">
      <button class="nav-btn" onclick="go('${backRoute||'#/dashboard'}')">← ${esc(backLabel||'Dashboard')}</button>
      <button class="nav-btn" id="quizRetry">ทำใหม่อีกครั้ง</button>
    </div>
  `;
  document.getElementById("quizRetry").addEventListener("click", ()=>render());
  document.getElementById("quizSubmit").addEventListener("click", ()=>{
    let score=0;
    questions.forEach((q,qi)=>{
      const picked = document.querySelector(`input[name="q${qi}"]:checked`);
      const pickedVal = picked ? parseInt(picked.value) : -1;
      if(pickedVal===q.correct) score++;
      document.querySelectorAll(`[data-qi="${qi}"]`).forEach(lab=>{
        const oi = parseInt(lab.getAttribute("data-oi"));
        if(oi===q.correct) lab.classList.add("correct");
        else if(oi===pickedVal) lab.classList.add("wrong");
      });
      document.getElementById(`explain-${qi}`).classList.add("show");
    });
    document.getElementById("quizResult").textContent = `คะแนน: ${score} / ${questions.length}`;
    document.getElementById("quizSubmit").disabled = true;
    onFinish(score, questions.length);
  });
}
function renderQuiz(modId){
  const m = MODULES.find(x=>x.id===modId);
  if(!m || !m.quiz){ go("#/dashboard"); return; }
  renderQuizGeneric(`แบบทดสอบ: ${m.short}`, m.quiz, (score,total)=>{
    state.quizScores[m.id] = {score,total,ts:Date.now()};
    saveState();
  }, `#/module/${m.id}`, m.short);
}
function renderMockExam(){
  renderQuizGeneric("Mock Exam (คละทุก domain)", MOCK_EXAM.questions, (score,total)=>{
    state.quizScores["mock"] = {score,total,ts:Date.now()};
    saveState();
  }, "#/dashboard", "Dashboard");
}

/* ============ MAIN RENDER ============ */
let keepScroll = false;
function render(){
  renderSidebar();
  updateTopProgress();
  document.getElementById("sidebar").classList.remove("open");
  const hash = location.hash;
  let mm;
  if(hash==="" || hash==="#/dashboard"){ renderDashboard(); }
  else if((mm=hash.match(/^#\/module\/([^\/]+)\/topic\/([^\/]+)$/))){ renderTopic(mm[1], mm[2]); }
  else if((mm=hash.match(/^#\/module\/([^\/]+)$/))){ renderModule(mm[1]); }
  else if((mm=hash.match(/^#\/quiz\/([^\/]+)$/))){ renderQuiz(mm[1]); }
  else if(hash==="#/mock-exam"){ renderMockExam(); }
  else { renderDashboard(); }
  if(keepScroll){ keepScroll = false; } else { window.scrollTo(0,0); }
}
render();
</script>
